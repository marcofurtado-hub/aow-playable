/* ---------------- shared block ops ---------------- */
function alignSel(mode){
  const hit=sel?findBlock(sel):null; if(!hit)return;
  if(hit.kind==="row"){
    const total=(hit.r.padL||0)+(hit.r.padR||0);
    if(!total&&["left","center","right"].includes(mode)){toast("no margin — pull a side handle, or press F to free it");return;}
  }
  commit(()=>{
    if(hit.kind==="row"){
      const r=hit.r,total=(r.padL||0)+(r.padR||0);
      if(mode==="left"){r.padL=0;r.padR=total;}
      if(mode==="center"){r.padL=Math.round(total/2);r.padR=total-r.padL;}
      if(mode==="right"){r.padL=total;r.padR=0;}
    }else{
      const f=hit.f;
      if(mode==="left")f.x=PADH;
      if(mode==="center")f.x=Math.round((PT_W-f.w)/2);
      if(mode==="right")f.x=PT_W-PADH-f.w;
      if(mode==="top")f.y=SAFE_T+8;
      if(mode==="middle")f.y=Math.round((SAFE_T+PT_H-f.h)/2);
      if(mode==="bottom")f.y=PT_H-16-f.h;
    }
  });
}
function alignBtnsHTML(isRow){
  let h=`<button class="btn mini" data-al="left" title="align left">⇤</button>
  <button class="btn mini" data-al="center" title="center">⇆</button>
  <button class="btn mini" data-al="right" title="align right">⇥</button>`;
  if(!isRow)h+=`<button class="btn mini" data-al="top" title="top">⤒</button>
  <button class="btn mini" data-al="middle" title="middle">⇅</button>
  <button class="btn mini" data-al="bottom" title="bottom">⤓</button>`;
  return h;
}
/* free from the grid ↔ snap back (move any block freely) */
function detachSel(){
  const hit=sel?findBlock(sel):null; if(!hit||hit.kind!=="row"){toast("already free");return;}
  commit(()=>{
    const s=curScreen();
    const ri=s.rows.indexOf(hit.r), li=layoutRows(s)[ri];
    const bi=hit.r.blocks.indexOf(hit.b), lb=li.blocks[bi];
    s.floats=s.floats||[];
    s.floats.push({id:hit.b.id,label:hit.b.label,role:hit.b.role,link:hit.b.link||null,
      inner:hit.b.inner||null,shape:hit.b.shape,flex:hit.b.flex||1,
      x:Math.round(lb.x0),y:Math.round(li.y0),w:Math.round(lb.x1-lb.x0),h:Math.round(li.h)});
    hit.r.blocks.splice(bi,1); if(!hit.r.blocks.length)s.rows.splice(ri,1);
  });
  toast("free — drag it anywhere · F snaps it back");
}
function attachSel(){
  const hit=sel?findBlock(sel):null; if(!hit||hit.kind!=="float"){toast("already on the grid");return;}
  commit(()=>{
    const s=curScreen(); const f=hit.f;
    const t=dropTarget({x:f.x+f.w/2,y:f.y+f.h/2});
    s.floats=s.floats.filter(x=>x!==f);
    const b={id:f.id,label:f.label,role:f.role,shape:f.shape==="round"?"button":(f.shape||"panel"),
      flex:1,link:f.link||null,inner:f.inner||null};
    if(t.row!==undefined&&s.rows[t.row])
      s.rows[t.row].blocks.splice(Math.min(t.idx,s.rows[t.row].blocks.length),0,b);
    else{
      const g=Math.max(0,Math.min(t.gap!==undefined?t.gap:s.rows.length,s.rows.length));
      s.rows.splice(g,0,{h:Math.max(ROW_MIN,Math.min(300,f.h)),blocks:[b]});
    }
  });
}
function duplicateSel(){
  const hit=sel?findBlock(sel):null; if(!hit)return;
  commit(()=>{
    const s=curScreen(), code=nextCode(s);
    if(hit.kind==="row"){const c={...clone(hit.b),id:code};
      s.rows.splice(s.rows.indexOf(hit.r)+1,0,{h:hit.r.grow?96:(hit.r.h||64),blocks:[c]});}
    else{const c={...clone(hit.f),id:code,x:Math.min(PT_W-hit.f.w,hit.f.x+16),y:Math.min(PT_H-hit.f.h,hit.f.y+16)};
      s.floats.push(c);}
    sel=code;
  });
}
function addBesideSel(){
  const hit=sel?findBlock(sel):null;
  if(!hit||hit.kind!=="row"){toast("row blocks only");return;}
  commit(()=>{
    const code=nextCode(curScreen());
    const mean=hit.r.blocks.reduce((a,x)=>a+(x.flex||1),0)/hit.r.blocks.length;
    hit.r.blocks.splice(hit.r.blocks.indexOf(hit.b)+1,0,
      {id:code,label:"New",role:"neutral",shape:hit.b.shape,flex:mean,link:null});
    sel=code;
  });
}
function deleteSel(){
  const hit=sel?findBlock(sel):null; if(!hit)return;
  commit(()=>{
    const s=curScreen();
    if(hit.kind==="row"){hit.r.blocks=hit.r.blocks.filter(x=>x!==hit.b); if(!hit.r.blocks.length)s.rows=s.rows.filter(x=>x!==hit.r);}
    else s.floats=s.floats.filter(x=>x!==hit.f);
    sel=null;
  });
}

/* ---------------- drag & drop ---------------- */
let drag=null, ghost=null, lastEv=null, raf=0;

function stagePt(e){
  const sr=stage.getBoundingClientRect();
  return {x:(e.clientX-sr.left)/scale, y:(e.clientY-sr.top)/scale};
}
function makeGhostFrom(rect,b){
  const gw=Math.min(rect.width,180), gh=Math.min(rect.height,72);
  /* clamp: on Alt-duplicate the rect belongs to the clone (offset from the cursor) */
  drag.offX=Math.max(8,Math.min(gw-8,(drag.x0-rect.left)*(gw/rect.width)));
  drag.offY=Math.max(6,Math.min(gh-6,(drag.y0-rect.top)*(gh/rect.height)));
  ghost=document.createElement("div");
  ghost.className="ghost"; ghost.style.cssText+=blockStyle(b);
  ghost.style.width=gw+"px"; ghost.style.height=gh+"px";
  ghost.innerHTML=`<span class="lbl">${esc(b.label)}</span>`;
  document.body.appendChild(ghost);
}
function moveGhost(e){
  if(!ghost)return;
  ghost.style.left=(e.clientX-drag.offX)+"px";
  ghost.style.top=(e.clientY-drag.offY-(drag.touch?30:0))+"px";
}
function killGhost(){if(ghost){ghost.remove();ghost=null;}}
function endDragChrome(){
  document.body.classList.remove("grabbing","rz");
  document.body.style.removeProperty("--rzCur");
  cueHide(); guidesHide(); hudHide();
}

function dropTarget(pt){
  const s=curScreen(), rows=layoutRows(s);
  if(!rows.length)return{gap:0};
  if(pt.y<rows[0].y0+10)return{gap:0};
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    if(pt.y>r.y1)continue;
    const band=Math.max(10,Math.min(18,r.h*0.35));
    if(pt.y<r.y0+band)return{gap:i};
    if(pt.y>r.y1-band)return{gap:i+1};
    for(let j=0;j<r.blocks.length;j++){
      const blk=r.blocks[j];
      if(pt.x<(blk.x0+blk.x1)/2)return{row:i,idx:j};
    }
    return{row:i,idx:r.blocks.length};
  }
  return{gap:rows.length};
}
const sameT=(a,b)=>a&&b&&a.gap===b.gap&&a.row===b.row&&a.idx===b.idx;
function moveBlock(s,code,t,newRowH){
  const p=blockPos(s,code); if(!p)return false;
  if(t.row!==undefined){
    if(t.row===p.ri&&p.len===1)return false;
    let ri=t.row, idx=t.idx;
    if(ri===p.ri){ if(idx>p.bi)idx--; if(idx===p.bi)return false; }
    const b=s.rows[p.ri].blocks.splice(p.bi,1)[0];
    if(!s.rows[p.ri].blocks.length){s.rows.splice(p.ri,1); if(ri>p.ri)ri--;}
    ri=Math.max(0,Math.min(ri,s.rows.length-1));
    const row=s.rows[ri];
    row.blocks.splice(Math.max(0,Math.min(idx,row.blocks.length)),0,b);
    return true;
  }
  let g=t.gap;
  if(p.len===1&&(g===p.ri||g===p.ri+1))return false;
  const srcRow=s.rows[p.ri];
  const b=srcRow.blocks.splice(p.bi,1)[0];
  if(!srcRow.blocks.length){s.rows.splice(p.ri,1); if(g>p.ri)g--;}
  g=Math.max(0,Math.min(g,s.rows.length));
  s.rows.splice(g,0,{h:newRowH||64,blocks:[b]});
  return true;
}
/* magnetic guide lines for floating blocks */
function guideLines(exceptCode){
  const s=curScreen(), rows=layoutRows(s);
  const v=[PADH,PT_W/2,PT_W-PADH], h=[SAFE_T,(SAFE_T+PT_H)/2,PT_H-16];
  rows.forEach(r=>h.push(r.y0));
  (s.floats||[]).forEach(f=>{
    if(f.id===exceptCode)return;
    v.push(f.x,f.x+f.w/2,f.x+f.w); h.push(f.y,f.y+f.h/2,f.y+f.h);
  });
  return {v,h};
}
function snapAxis(cands,vals,thr){ /* vals: block points (edge/centre/edge) → {d,line} or null */
  let best=null;
  for(const c of cands)for(const p of vals){
    const d=c-p; if(Math.abs(d)<=thr&&(!best||Math.abs(d)<Math.abs(best.d)))best={d,line:c};
  }
  return best;
}

stage.addEventListener("pointerdown",e=>{
  if(drag||e.button!==0)return;
  const grip=e.target.closest("[data-grip]");
  const h=grip?null:e.target.closest("[data-h]");
  const be=grip?grip.closest(".blk,.float"):e.target.closest(".blk,.float");
  if(mode==="play"){
    if(be&&be.dataset.link){navStack.push(state.current);navHist.push(state.current);state.current=be.dataset.link;render();}
    else if(be)toast("no link — set 'Links to' in Edit");
    return;
  }
  closeCtx();
  if(h&&sel){ /* transform box */
    const hit=findBlock(sel); if(!hit)return;
    const hd=h.dataset.h;
    if(hd==="gap"&&hit.kind==="row"){ /* kern: the space below the row */
      drag={type:"gap",hit,x0:e.clientX,y0:e.clientY,mb0:hit.r.mb||0,dirty:false,
        snap:clone(curScreen()),pid:e.pointerId,touch:e.pointerType==="touch"};
      document.body.style.setProperty("--rzCur","row-resize");
      document.body.classList.add("rz");
      try{stage.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); return;
    }
    const dirs={n:hd.includes("n"),s:hd.includes("s"),e:hd.includes("e"),w:hd.includes("w")};
    drag={type:"box",hit,dirs,x0:e.clientX,y0:e.clientY,dirty:false,snap:clone(curScreen()),
      pid:e.pointerId,touch:e.pointerType==="touch",corner:(dirs.n||dirs.s)&&(dirs.e||dirs.w)};
    if(hit.kind==="row"){
      const r=hit.r,i=r.blocks.indexOf(hit.b);
      if(r.grow){const lr=layoutRows(curScreen())[curScreen().rows.indexOf(r)];
        drag.h0=Math.round(lr.h); drag.wasGrow=true;}
      else drag.h0=r.h||64;
      drag.f0=hit.b.flex||1;
      drag.prev=r.blocks[i-1]||null; drag.fp0=drag.prev?(drag.prev.flex||1):0;
      drag.next=r.blocks[i+1]||null; drag.fn0=drag.next?(drag.next.flex||1):0;
      drag.ft=r.blocks.reduce((a,b)=>a+(b.flex||1),0);
      drag.padL0=r.padL||0; drag.padR0=r.padR||0; drag.n=r.blocks.length;
      /* N handle: the bottom edge stays put — the row above gives up the space.
         (with an "auto" row above, the layout absorbs it by itself) */
      if(dirs.n&&!dirs.s){
        const ri=curScreen().rows.indexOf(r);
        let growAbove=false;
        for(let i=ri-1;i>=0;i--)if(curScreen().rows[i].grow){growAbove=true;break;}
        if(!growAbove&&ri>0){drag.comp=curScreen().rows[ri-1];drag.compH0=drag.comp.h||64;}
      }
      const innerW=PT_W-2*PADH-drag.padL0-drag.padR0-GAP*(r.blocks.length-1);
      drag.k=drag.ft/innerW; drag.innerW=innerW;
    }else{
      drag.bx0=hit.f.x; drag.by0=hit.f.y; drag.bw0=hit.f.w; drag.bh0=hit.f.h;
      drag.gl=guideLines(sel);
    }
    document.body.style.setProperty("--rzCur",getComputedStyle(h).cursor);
    document.body.classList.add("rz");
    try{stage.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); return;
  }
  if(be){
    let code=be.dataset.code;
    /* Alt+drag = duplicate (15) — snapshot BEFORE the clone */
    let snapPre=clone(curScreen()), preDirty=false;
    if(e.altKey){
      const src=findBlock(code); const nc=nextCode(curScreen());
      if(src.kind==="row"){const c={...clone(src.b),id:nc};src.r.blocks.splice(src.r.blocks.indexOf(src.b)+1,0,c);}
      else curScreen().floats.push({...clone(src.f),id:nc,
        x:Math.min(PT_W-src.f.w,src.f.x+16),y:Math.min(PT_H-src.f.h,src.f.y+16)});
      code=nc; preDirty=true;
    }
    if(sel!==code){sel=code;}
    renderStage(false); renderSide();
    const liveEl=rowsEl.querySelector(`[data-code="${CSS.escape(code)}"]`);
    const rect=liveEl?liveEl.getBoundingClientRect():be.getBoundingClientRect();
    const hit=findBlock(code); if(!hit)return;
    /* corpo = ajuste fino (gap ↕ / margens ↔) · grip ✥ = mover entre linhas · Alt = duplicar+mover */
    const dragType=hit.kind!=="row"?"maybe-float":((grip||e.altKey)?"maybe-move":"maybe-fine");
    drag={type:dragType,hit,code,
      x0:e.clientX,y0:e.clientY,rect,
      pid:e.pointerId,touch:e.pointerType==="touch",
      slop:e.pointerType==="touch"?9:4,
      fx0:hit.f?hit.f.x:0,fy0:hit.f?hit.f.y:0,
      started:false,dirty:preDirty,
      snap:snapPre,
      gl:hit.kind==="float"?guideLines(code):null,
      rowH:hit.r?(hit.r.grow?96:(hit.r.h||64)):64};
    if(dragType==="maybe-fine"){
      const rows=curScreen().rows, ri=rows.indexOf(hit.r);
      drag.fineRi=ri;
      /* an "auto" row above absorbs gaps above → the block is anchored from below:
         the lever becomes the gap BELOW itself */
      drag.growAbove=rows.slice(0,ri).some(x=>x.grow);
      drag.rowAbove=ri>0?rows[ri-1]:null;
      drag.mbA0=drag.rowAbove?(drag.rowAbove.mb||0):null;
      drag.mbS0=hit.r.mb||0;
      drag.pt0=stagePt(e);
      drag.padL0=hit.r.padL||0; drag.padR0=hit.r.padR||0;
      drag.solo=hit.r.blocks.length===1;
    }
    /* long-press → context menu (13) */
    if(drag.touch)drag.lpTimer=setTimeout(()=>{
      if(drag&&(drag.type==="maybe-move"||drag.type==="maybe-float")&&!drag.started){openCtx(drag.x0,drag.y0);drag=null;}
    },500);
    try{stage.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault();
  }else{ sel=null; render(); }
});

stage.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  lastEv=e;
  if(document.visibilityState==="hidden"){ /* hidden tab: rAF does not fire */
    if(raf){cancelAnimationFrame(raf);raf=0;}
    dragFrame(e); return;
  }
  if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(drag&&lastEv)dragFrame(lastEv);});
});

function dragFrame(e){
  const dx=(e.clientX-drag.x0)/scale, dy=(e.clientY-drag.y0)/scale;
  switch(drag.type){
    case "gap":{
      const r=drag.hit.r;
      let mb=Math.max(0,Math.min(160,Math.round(drag.mb0+dy)));
      let snapped=false;
      if(!e.altKey){const near=[0,4,8,12,16,24,32].reduce((a,v)=>Math.abs(v-mb)<Math.abs(a-mb)?v:a);
        if(Math.abs(near-mb)<=2){mb=near;snapped=true;}}
      r.mb=mb; drag.dirty=true; renderStage(false);
      const li=layoutRows(curScreen()), ri=curScreen().rows.indexOf(r);
      if(li[ri])hudShow(`gap ${mb}pt`,PT_W-90,li[ri].y1+8,snapped);
      return;}
    case "box":{
      const D=drag.dirs, noSnap=e.altKey;
      if(drag.hit.kind==="row"){
        const r=drag.hit.r, b=drag.hit.b;
        /* Shift em canto = trava no eixo dominante (10) */
        let doV=D.n||D.s, doH=D.e||D.w;
        if(e.shiftKey&&drag.corner){
          if(Math.abs(e.clientX-drag.x0)>=Math.abs(e.clientY-drag.y0))doV=false; else doH=false;
        }
        /* a locked axis returns to its origin value (no leftovers from the previous frame) */
        if(!doV&&(D.n||D.s)){
          if(drag.wasGrow){if(!r.grow)r.grow=1;}
          else r.h=drag.h0;
          if(drag.comp)drag.comp.h=drag.compH0;
        }
        if(!doH&&(D.e||D.w)){
          b.flex=drag.f0;
          if(D.e&&drag.next)drag.next.flex=drag.fn0;
          if(D.w&&drag.prev)drag.prev.flex=drag.fp0;
          if((D.e&&!drag.next)||(D.w&&!drag.prev)){r.padR=drag.padR0;r.padL=drag.padL0;}
        }
        let hudTxt=[], snapped=false;
        if(doV){
          if(drag.wasGrow){r.grow=0;r.h=drag.h0;}
          const dh=D.s?dy:-dy;
          let nh=Math.max(ROW_MIN,Math.min(500,Math.round(drag.h0+dh)));
          if(!noSnap){ /* NEAREST preset, ±2 band — free values stay reachable */
            const near=SNAP_HTS.reduce((a,v)=>Math.abs(v-nh)<Math.abs(a-nh)?v:a);
            if(Math.abs(near-nh)<=2){nh=near;snapped=true;}}
          if(drag.comp){ /* N: the row above compensates → bottom edge stays put */
            nh=Math.min(nh,drag.h0+(drag.compH0-ROW_MIN));
            drag.comp.h=Math.max(ROW_MIN,Math.round(drag.compH0-(nh-drag.h0)));
          }
          r.h=nh; hudTxt.push((drag.wasGrow?"auto → ":"h ")+nh+"pt");
        }
        if(doH){
          const other=D.e?drag.next:drag.prev;
          if(other){ /* has a neighbour → trade flex */
            const side=D.e?1:-1;
            const o0=D.e?drag.fn0:drag.fp0;
            let d=side*dx*drag.k;
            d=Math.max(-(drag.f0-0.25),Math.min(d,o0-0.25));
            let nf=drag.f0+d;
            if(!noSnap){ /* snap to row fractions (7) */
              const n=drag.hit.r.blocks.length;
              const fracs=SNAP_FRACS.concat([1/n]);
              for(const fr of fracs){
                const target=fr*drag.ft;
                if(Math.abs((nf-target)/drag.k)<=5&&target>=0.25&&(drag.f0+o0-target)>=0.25){
                  nf=target;snapped=true;break;}
              }
            }
            b.flex=nf; other.flex=drag.f0+o0-nf;
            const wPt=Math.round(drag.innerW*nf/drag.ft);
            const fr=SNAP_FRACS.concat([1/drag.hit.r.blocks.length]).find(f=>Math.abs(f*drag.ft-nf)<0.01);
            hudTxt.push(wPt+"pt"+(fr?` · ${fr===.5?"1/2":fr===.25?"1/4":fr===.75?"3/4":Math.abs(fr-1/3)<.01?"1/3":Math.abs(fr-2/3)<.01?"2/3":"1/"+drag.hit.r.blocks.length}`:""));
          }else{ /* outer edge → side margin: SYMMETRIC by default; Shift = one side only */
            const isE=D.e, sym=!e.shiftKey;
            let pad=isE?drag.padR0-dx:drag.padL0+dx;
            const budget=PT_W-2*PADH-40*drag.n-GAP*(drag.n-1);
            const maxPad=sym?Math.floor(budget/2):budget-(isE?(r.padL||0):(r.padR||0));
            pad=Math.max(0,Math.min(maxPad,Math.round(pad)));
            if(!noSnap){
              if(pad<=3){pad=0;snapped=true;}
              else if(!sym){const op=isE?(r.padL||0):(r.padR||0);
                if(op>0&&Math.abs(pad-op)<=3){pad=op;snapped=true;}}
            }
            if(sym){r.padL=pad;r.padR=pad;}
            else if(isE)r.padR=pad; else r.padL=pad;
            const iw=PT_W-2*PADH-(r.padL||0)-(r.padR||0)-GAP*(drag.n-1);
            hudTxt.push(Math.round(iw*(b.flex||1)/drag.ft)+"pt"+(pad?` · m ${pad}${sym?" ⇆":""}`:""));
          }
        }
        drag.dirty=true; renderStage(false);
        const li=layoutRows(curScreen()), ri=curScreen().rows.indexOf(r);
        const lb=li[ri]&&li[ri].blocks.find(x=>x.code===b.id);
        if(lb)hudShow(hudTxt.join(" · "),lb.x0,li[ri].y0,snapped);
      }else{
        const f=drag.hit.f;
        let x=drag.bx0,y=drag.by0,w=drag.bw0,h=drag.bh0;
        if(D.e)w=drag.bw0+dx;
        if(D.s)h=drag.bh0+dy;
        if(D.w)w=drag.bw0-dx;
        if(D.n)h=drag.bh0-dy;
        /* Shift = keep ratio on the corner (10) */
        if(e.shiftKey&&drag.corner){
          if(Math.abs(dx)>=Math.abs(dy))h=w*drag.bh0/drag.bw0; else w=h*drag.bw0/drag.bh0;
        }
        w=Math.max(36,Math.round(w)); h=Math.max(36,Math.round(h));
        let snapped=false;
        const aspectLock=f.shape==="round"||(e.shiftKey&&drag.corner);
        if(!noSnap){const sw=Math.round(w/4)*4, sh=Math.round(h/4)*4;
          if(Math.abs(sw-w)<=2){w=sw;snapped=true;} if(Math.abs(sh-h)<=2){h=sh;snapped=true;}}
        if(f.shape==="round"){ /* locks on the DRIVEN dimension — shrinking works */
          let sz;
          if(drag.corner)sz=Math.abs(dx)>=Math.abs(dy)?w:h;
          else if(D.e||D.w)sz=w; else sz=h;
          w=sz;h=sz;
        }
        if(e.altKey&&!e.shiftKey){ /* Alt = from the centre (10) */
          x=drag.bx0+(drag.bw0-w)/2; y=drag.by0+(drag.bh0-h)/2;
        }else{
          if(D.w)x=drag.bx0+drag.bw0-w;
          if(D.n)y=drag.by0+drag.bh0-h;
        }
        /* magnetic guides on the moving edge (9) — skipped under a ratio/circle lock:
           snapping one dimension alone would break the lock (ellipse) */
        let gv=[],gh2=[];
        if(!noSnap&&!aspectLock&&drag.gl){
          if(D.e||D.w){const edge=D.e?x+w:x;const sn=snapAxis(drag.gl.v,[edge],6);
            if(sn){if(D.e)w+=sn.d;else{x+=sn.d;w-=sn.d;}gv.push(sn.line);snapped=true;}}
          if(D.s||D.n){const edge=D.s?y+h:y;const sn=snapAxis(drag.gl.h,[edge],6);
            if(sn){if(D.s)h+=sn.d;else{y+=sn.d;h-=sn.d;}gh2.push(sn.line);snapped=true;}}
        }
        f.w=Math.min(Math.max(36,Math.round(w)),PT_W);
        f.h=Math.min(Math.max(36,Math.round(h)),PT_H-SAFE_T);
        f.x=Math.max(0,Math.min(PT_W-f.w,Math.round(x)));
        f.y=Math.max(SAFE_T,Math.min(PT_H-f.h,Math.round(y)));
        drag.dirty=true; renderStage(false);
        drawGuides(gv,gh2);
        hudShow(`${f.w} × ${f.h}pt`,f.x,f.y,snapped);
      }
      return;}
    case "maybe-float":
      if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<drag.slop)return;
      clearTimeout(drag.lpTimer);
      drag.type="float-move";
      /* fallthrough */
    case "float-move":{
      const f=drag.hit.f;
      let x=drag.fx0+dx, y=drag.fy0+dy;
      let gv=[],gh2=[],snapped=false;
      if(!e.altKey&&drag.gl){
        const sx=snapAxis(drag.gl.v,[x,x+f.w/2,x+f.w],6);
        if(sx){x+=sx.d;gv.push(sx.line);snapped=true;}
        const sy=snapAxis(drag.gl.h,[y,y+f.h/2,y+f.h],6);
        if(sy){y+=sy.d;gh2.push(sy.line);snapped=true;}
      }
      f.x=Math.max(0,Math.min(PT_W-f.w,Math.round(x)));
      f.y=Math.max(SAFE_T,Math.min(PT_H-f.h,Math.round(y)));
      if(!drag.started){drag.started=true;document.body.classList.add("grabbing");}
      drag.dirty=true; renderStage(false);
      drawGuides(gv,gh2);
      hudShow(`x ${f.x} · y ${f.y}`,f.x,f.y,snapped);
      return;}
    case "maybe-fine":
      if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<drag.slop)return;
      drag.type="fine"; drag.started=true;
      document.body.classList.add("grabbing");
      /* fallthrough */
    case "fine":{
      const r=drag.hit.r, pt=stagePt(e);
      let hudTxt=[], snapped=false, gv=[];
      /* ↕ moves the block by editing the spacing: top-anchored → gap above;
         with "auto" above (bottom-anchored) → the gap below itself */
      const dyPt=pt.y-drag.pt0.y;
      const snapMb=mb=>{if(e.altKey)return{mb,s:false};
        const near=[0,4,8,12,16,24,32].reduce((a,v)=>Math.abs(v-mb)<Math.abs(a-mb)?v:a);
        return Math.abs(near-mb)<=2?{mb:near,s:true}:{mb,s:false};};
      if(drag.growAbove){
        let v=snapMb(Math.max(0,Math.min(160,Math.round(drag.mbS0-dyPt))));
        r.mb=v.mb; if(v.s)snapped=true;
        hudTxt.push(`gap↓ ${v.mb}pt`);
      }else if(drag.rowAbove){
        let v=snapMb(Math.max(0,Math.min(160,Math.round(drag.mbA0+dyPt))));
        drag.rowAbove.mb=v.mb; if(v.s)snapped=true;
        hudTxt.push(`gap↑ ${v.mb}pt`);
      }
      /* ↔ slides through the margins (solo block with slack) */
      const total=drag.padL0+drag.padR0;
      if(drag.solo&&total>0){
        const w=PT_W-2*PADH-total;
        let pl=Math.round(pt.x-PADH-w/2);
        pl=Math.max(0,Math.min(total,pl));
        if(!e.altKey){
          if(pl<=4){pl=0;snapped=true;gv=[PADH];}
          else if(pl>=total-4){pl=total;snapped=true;gv=[PT_W-PADH];}
          else if(Math.abs(pl-total/2)<=4){pl=Math.round(total/2);snapped=true;gv=[PT_W/2];}
        }
        r.padL=pl;r.padR=total-pl;
        hudTxt.push(pl===0?"⇤":pl===total?"⇥":`x ${PADH+pl}pt`);
      }
      drag.dirty=true; renderStage(false); drawGuides(gv,[]);
      const li=layoutRows(curScreen()), ri=curScreen().rows.indexOf(r);
      if(li[ri])hudShow(hudTxt.join(" · ")||"topo fixo",PADH+4,li[ri].y0,snapped);
      return;}
    case "maybe-move":
      if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<drag.slop)return;
      clearTimeout(drag.lpTimer);
      drag.type="move"; drag.started=true;
      document.body.classList.add("grabbing");
      drag.lastT=null; drag.lastX=e.clientX; drag.lastY=e.clientY; drag.lastAt=performance.now();
      makeGhostFrom(drag.rect,drag.hit.b);
      renderStage(false);
      /* fallthrough */
    case "move":{
      moveGhost(e);
      const pt0=stagePt(e);
      guidesHide();
      const t=dropTarget(pt0);
      /* hysteresis (1): only re-applies when the target changed AND there was movement/dwell */
      let tCue=t;
      if(!sameT(t,drag.lastT)&&
         (drag.lastT===null||
          Math.hypot(e.clientX-drag.lastX,e.clientY-drag.lastY)>8||
          performance.now()-drag.lastAt>150)){
        if(moveBlock(curScreen(),sel,t,drag.rowH)){
          drag.dirty=true; renderStage(true);
          tCue=dropTarget(stagePt(e)); // índices pós-mutação para o cue
        }
        drag.lastT=t; drag.lastX=e.clientX; drag.lastY=e.clientY; drag.lastAt=performance.now();
      }
      /* the cue always follows (C7) — post-mutation geometry */
      if(tCue.gap!==undefined){
        const p=blockPos(curScreen(),sel);
        if(p&&p.len===1&&(tCue.gap===p.ri||tCue.gap===p.ri+1))cueSlotSelf(p.ri);
        else cueGap(tCue.gap);
      }else cueSlot(tCue.row,tCue.idx);
      return;}
  }
}
function cueSlotSelf(ri){ /* target = where the block already is: outline its own row */
  const rows=layoutRows(curScreen()); const r=rows[ri]; if(!r){cueHide();return;}
  dropCue.style.cssText=`display:block;left:${PADH*scale}px;top:${(r.y0-1.5)*scale}px;width:${(PT_W-2*PADH)*scale}px;height:3px;opacity:.35;`;
}

stage.addEventListener("pointerup",e=>{
  if(!drag||(e&&e.pointerId!==drag.pid))return;
  /* flush: apply the last pending move before releasing (precise snap) */
  if(raf){cancelAnimationFrame(raf);raf=0;}
  if(lastEv&&drag.started!==false)try{dragFrame(lastEv);}catch(_){}
  if(!drag)return; // dragFrame pode ter encerrado (long-press etc.)
  clearTimeout(drag.lpTimer);
  const wasMove=drag.type==="move";
  const freeDrop=wasMove&&(e.metaKey||e.ctrlKey)&&drag.hit.kind==="row";
  const dropPt=freeDrop?stagePt(e):null;
  const {dirty,snap}=drag;
  const g=ghost; ghost=null;
  /* flex limpo no estado (7) */
  if(drag.type==="box"&&drag.hit.kind==="row"){
    drag.hit.r.blocks.forEach(x=>x.flex=Math.round((x.flex||1)*100)/100);
  }
  drag=null; lastEv=null;
  endDragChrome();
  if(dirty&&snap){
    const s=curScreen();
    undoStack.push((()=>{const st=clone(state);
      const i=st.screens.findIndex(x=>x.id===s.id); st.screens[i]=snap; return st;})());
    if(undoStack.length>40)undoStack.shift();
    scheduleSave();
  }
  render();
  /* ⌘/Ctrl on release = take it off the grid and drop it free at the cursor */
  if(freeDrop&&sel){
    detachSel();
    const h2=findBlock(sel);
    if(h2&&h2.kind==="float"){
      h2.f.x=Math.round(Math.max(0,Math.min(PT_W-h2.f.w,dropPt.x-h2.f.w/2)));
      h2.f.y=Math.round(Math.max(SAFE_T,Math.min(PT_H-h2.f.h,dropPt.y-h2.f.h/2)));
      render(); scheduleSave();
    }
  }
  /* landing animation (3) */
  if(wasMove&&g){
    const el=rowsEl.querySelector(`[data-code="${CSS.escape(sel)}"]`);
    if(el){const r=el.getBoundingClientRect();
      g.style.transition="all .14s ease";
      g.style.left=r.left+"px"; g.style.top=r.top+"px";
      g.style.width=r.width+"px"; g.style.height=r.height+"px";
      g.style.transform="none"; g.style.opacity=".5";
      setTimeout(()=>g.remove(),160);
    }else g.remove();
  }else if(g)g.remove();
});
stage.addEventListener("pointercancel",e=>{
  if(drag&&e.pointerId!==drag.pid)return;
  cancelDrag();
});
function cancelDrag(){
  if(!drag)return;
  clearTimeout(drag.lpTimer);
  if(drag.snap){const s=curScreen();const i=state.screens.indexOf(s);state.screens[i]=drag.snap;}
  killGhost(); endDragChrome();
  drag=null; lastEv=null; render();
}

/* ---------------- rename inline (12) ---------------- */
function startRename(code){
  const hit=findBlock(code); if(!hit)return;
  const b=hit.kind==="row"?hit.b:hit.f;
  const el=rowsEl.querySelector(`[data-code="${CSS.escape(code)}"]`); if(!el)return;
  if(el.querySelector(".rename"))return; /* already editing */
  const inp=document.createElement("input");
  inp.className="rename"; inp.value=b.label;
  inp.addEventListener("pointerdown",ev=>ev.stopPropagation());
  inp.addEventListener("dblclick",ev=>ev.stopPropagation());
  inp.addEventListener("contextmenu",ev=>ev.stopPropagation());
  inp.addEventListener("keydown",ev=>{
    ev.stopPropagation();
    if(ev.key==="Enter"){inp.blur();}
    if(ev.key==="Escape"){inp.dataset.cancel="1";inp.blur();}
  });
  inp.addEventListener("blur",()=>{
    const v=inp.value.trim();
    if(!inp.dataset.cancel&&v&&v!==b.label)commit(()=>{b.label=v;});
    else render();
  });
  el.appendChild(inp); inp.focus(); inp.select();
}
stage.addEventListener("dblclick",e=>{
  if(mode!=="edit")return;
  /* pointer capture retargets click/dblclick to #stage — resolve by coordinate */
  const hitEl=document.elementFromPoint(e.clientX,e.clientY);
  if(hitEl&&hitEl.closest(".rename"))return;
  const be=hitEl?hitEl.closest(".blk,.float"):null;
  if(be){startRename(be.dataset.code);return;}
  const t=dropTarget(stagePt(e));
  if(t.gap!==undefined){
    commit(()=>{
      const s=curScreen(), code=nextCode(s);
      s.rows.splice(Math.min(t.gap,s.rows.length),0,
        {h:64,blocks:[{id:code,label:"New",role:"neutral",shape:"panel",flex:1,link:null}]});
      sel=code;
    });
  }
});

/* ---------------- context menu (13) ---------------- */
function openCtx(x,y){
  if($("#ctx"))return;
  const hit=sel?findBlock(sel):null; if(!hit)return;
  const b=hit.kind==="row"?hit.b:hit.f;
  const m=document.createElement("div"); m.id="ctx";
  m.innerHTML=`<div class="cTitle">${esc(b.label)}</div>
    <div class="cRow">${Object.entries(ROLES).map(([k,v])=>
      `<div class="sw${b.role===k?" on":""}" data-role="${k}" title="${v.name}" style="background:${v.c}"></div>`).join("")}</div>
    <div class="cRow">${alignBtnsHTML(hit.kind==="row")}</div>
    <select id="ctxLink"><option value="">— links to… —</option>${
      state.screens.map(s=>`<option value="${s.id}"${b.link===s.id?" selected":""}>${esc(s.name)}</option>`).join("")}</select>
    <button class="btn mini" data-a="ren">✏️ Rename</button>
    <button class="btn mini" data-a="dup">⧉ Duplicate</button>
    <button class="btn mini" data-a="side">+ beside</button>
    <button class="btn mini" data-a="float">${hit.kind==="row"?"🔓 Take off the grid":"🔒 Snap to the grid"}</button>
    <button class="btn mini" data-a="del" style="color:#f0928c">🗑 Delete</button>`;
  document.body.appendChild(m);
  const mw=m.offsetWidth, mh=m.offsetHeight;
  m.style.left=Math.min(x,innerWidth-mw-8)+"px";
  m.style.top=Math.min(y,innerHeight-mh-8)+"px";
  m.querySelectorAll(".sw").forEach(el=>el.onclick=()=>{commit(()=>{b.role=el.dataset.role;});closeCtx();});
  m.querySelectorAll("[data-al]").forEach(el=>el.onclick=()=>{closeCtx();alignSel(el.dataset.al);});
  m.querySelector("#ctxLink").onchange=e=>{commit(()=>{b.link=e.target.value||null;});closeCtx();};
  m.querySelectorAll("[data-a]").forEach(el=>el.onclick=()=>{
    const a=el.dataset.a; closeCtx();
    if(a==="ren")startRename(sel);
    if(a==="dup")duplicateSel();
    if(a==="side")addBesideSel();
    if(a==="float"){const h2=findBlock(sel);if(h2&&h2.kind==="row")detachSel();else attachSel();}
    if(a==="del")deleteSel();
  });
  m.addEventListener("pointerdown",ev=>ev.stopPropagation());
  setTimeout(()=>document.addEventListener("pointerdown",closeCtx,{once:true}),0);
}
function closeCtx(){const m=$("#ctx");if(m)m.remove();}
stage.addEventListener("contextmenu",e=>{
  if(mode!=="edit")return;
  if(e.target.closest(".rename"))return; /* the native paste menu stays alive */
  const be=e.target.closest(".blk,.float");
  if(!be)return;
  e.preventDefault();
  sel=be.dataset.code; renderStage(false); renderSide();
  openCtx(e.clientX,e.clientY);
});

/* ---------------- toolbar / dialogs ---------------- */
function setMode(m){
  if(mode===m)return;
  mode=m; sel=null; navStack=[]; closeCtx();
  document.body.classList.toggle("play",mode==="play");
  render();
}
$("#editBtn").onclick=()=>setMode("edit");
$("#playBtn").onclick=()=>setMode("play");
$("#undoBtn").onclick=undo;
/* free from the grid / snap back — the short path to move a button anywhere */
function toggleFree(){
  const h=sel?findBlock(sel):null;
  if(!h){toast("select a block first");return;}
  h.kind==="row"?detachSel():attachSel();
}
$("#freeBtn").onclick=toggleFree;
$("#navBackBtn").onclick=()=>{
  if(!navHist.length){toast("no previous screen");return;}
  state.current=navHist.pop(); sel=null;
  if(navStack.length)navStack.pop();
  render(); scheduleSave();
};
$("#backChip").onclick=()=>{if(navStack.length){state.current=navStack.pop();render();}};
$("#zonesBtn").onclick=()=>{zonesOn=!zonesOn;$("#zonesBtn").classList.toggle("on",zonesOn);renderChrome();};
$("#refBtn").onclick=()=>{const off=document.body.classList.toggle("refOff");
  try{localStorage.setItem("mlabRef",off?"off":"on");}catch(e){}
  $("#refBtn").classList.toggle("on",!off); fit(true); renderStage(false);};
try{if(localStorage.getItem("mlabRef")==="off")document.body.classList.add("refOff");else $("#refBtn").classList.add("on");}
catch(e){$("#refBtn").classList.add("on");}
$("#addBtn").onclick=()=>{
  dlgShow(`<h3 style="margin-top:0;font-family:var(--display);text-transform:uppercase">New element</h3>
  <div class="rowBtns" style="flex-direction:column;align-items:stretch;gap:8px">
    <button class="btn" data-k="panel">Panel</button>
    <button class="btn" data-k="button">Button</button>
    <button class="btn" data-k="strip">Thin strip</button>
    <button class="btn" data-k="round">● Floating round button</button>
    <button class="btn" data-k="fbtn">Floating button</button>
  </div>
  <p class="hint" style="margin:8px 0 0">inserted right below the selection — or at the end when nothing is selected</p>`,k=>{
    commit(()=>{
      const s=curScreen(), code=nextCode(s);
      const ROLE_DEF={button:"gain",strip:"neutral",panel:"neutral",round:"info",fbtn:"info"};
      if(k==="round"||k==="fbtn"){
        s.floats=s.floats||[];
        const base=sel&&findBlock(sel)&&findBlock(sel).kind==="float"?findBlock(sel).f:null;
        s.floats.push({id:code,label:"New",role:ROLE_DEF[k],shape:k==="round"?"round":"button",
          x:base?Math.min(PT_W-64,base.x+16):PT_W-92,
          y:base?Math.min(PT_H-64,base.y+16):PT_H-260,
          w:64,h:k==="round"?64:44,link:null});
      }else{
        const hit=sel?findBlock(sel):null;
        const h=k==="strip"?SHAPE_H.strip:(k==="button"?SHAPE_H.button:SHAPE_H.panel);
        const nb={id:code,label:"New",role:ROLE_DEF[k],shape:k,flex:1,link:null};
        if(hit&&hit.kind==="row"){ /* smart insert (14): right below the selection, inherits context */
          const at=s.rows.indexOf(hit.r)+1;
          s.rows.splice(at,0,{h:hit.r.grow?h:(hit.r.h||h),blocks:[{...nb,role:hit.b.role}]});
        }else{
          s.rows.splice(Math.max(0,s.rows.length-1),0,{h,blocks:[nb]});
        }
      }
      sel=code;
    });
    toast("block created");
  });
};
function addScreen(){
  dlgShow(`<h3 style="margin-top:0;font-family:var(--display);text-transform:uppercase">New screen</h3>
  <div class="field"><label>Screen name</label><input type="text" id="nsName" value="New screen"></div>
  <div class="rowBtns"><button class="btn primary" data-k="ok">Create</button></div>`,()=>{
    const name=$("#nsName").value.trim()||"Tela";
    /* the code is internal (the id prefix) — it never shows up in the interface */
    let code=name.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)||"TELA";
    while(state.screens.some(s=>s.id===code))code+=String.fromCharCode(65+Math.floor(Math.random()*26));
    commit(()=>{
      state.screens.push({id:code,name,floats:[],rows:[
        {h:44,blocks:[{id:code+"-01",label:"Header",role:"neutral",shape:"strip",flex:1,link:null}]},
        {grow:1,blocks:[{id:code+"-02",label:"Content",role:"neutral",shape:"panel",flex:1,link:null}]}]});
      state.current=code; sel=null;
    });
  });
}
$("#copyBtn").onclick=async()=>{
  try{await navigator.clipboard.writeText(JSON.stringify(state,null,1));toast("JSON copied — paste it to me in chat");}
  catch(e){dlgShow(`<h3 style="margin-top:0">JSON</h3><textarea readonly>${esc(JSON.stringify(state))}</textarea>`,null);}
};
$("#pasteBtn").onclick=()=>{
  dlgShow(`<h3 style="margin-top:0">Import JSON</h3><textarea id="impTxt" placeholder="paste here"></textarea>
  <div class="rowBtns" style="margin-top:8px"><button class="btn primary" data-k="ok">Import</button></div>`,()=>{
    try{
      const v=JSON.parse($("#impTxt").value);
      if(!v||!Array.isArray(v.screens))throw 0;
      commit(()=>{state=migrate(v); if(!state.screens.some(s=>s.id===state.current))state.current=state.screens[0].id; sel=null;});
      toast("imported");
    }catch(e){toast("invalid JSON");}
  });
};
$("#saveBtn").onclick=async()=>{clearTimeout(saveTimer);await doSave();toast(db?"saved to cloud":"saved locally (no cloud)");};
$("#figmaBtn").onclick=async()=>{
  clearTimeout(saveTimer);await doSave();
  toast("state saved — in chat, ask: 'export to Figma'");
};
$("#reloadBtn").onclick=async()=>{
  if(!db){toast("no cloud in this view");return;}
  try{
    const snap=await db.doc("layout/main").get();
    if(snap.exists&&snap.data()&&snap.data().screens){
      state=migrate(clone(snap.data())); if(!state.screens.some(s=>s.id===state.current))state.current=state.screens[0].id;
      sel=null; undoStack=[]; lsSet(state); render(); toast("reloaded from cloud");
    } else toast("nothing in the cloud");
  }catch(e){toast("failed to read cloud");}
};
$("#resetBtn").onclick=()=>{
  const btn=$("#resetBtn");
  if(btn.dataset.arm){commit(()=>{state=defaultState();sel=null;});btn.textContent="Reset";delete btn.dataset.arm;}
  else{btn.dataset.arm="1";btn.textContent="Confirm reset?";
    setTimeout(()=>{btn.textContent="Reset";delete btn.dataset.arm;},2500);}
};

/* ---------------- keyboard (11) — the Esc chain (C6) ---------------- */
let lastNudge=0;
document.addEventListener("keydown",e=>{
  const typing=!!(e.target&&e.target.matches&&e.target.matches("input,textarea,select"));
  if(e.key==="Escape"){
    /* Esc exits everything, in order: drag → menu → selection → test mode */
    if(drag){cancelDrag();return;}
    if($("#ctx")){closeCtx();return;}
    if(mode==="edit"&&sel){sel=null;render();return;}
    if(mode==="play"){setMode("edit");toast("edit mode");return;}
    return;
  }
  if(typing)return;
  if(drag)return; /* global shortcuts never mutate state in the middle of a drag */
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();undo();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="d"){e.preventDefault();if(sel&&mode==="edit")duplicateSel();return;}
  if(!e.ctrlKey&&!e.metaKey&&e.key.toLowerCase()==="f"&&sel&&mode==="edit"){e.preventDefault();toggleFree();return;}
  if((e.key==="Delete"||e.key==="Backspace")&&sel&&mode==="edit"){e.preventDefault();deleteSel();return;}
  if(e.key==="Enter"&&sel&&mode==="edit"){e.preventDefault();startRename(sel);return;}
  if(mode==="edit"&&sel&&["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){
    e.preventDefault();
    const hit=findBlock(sel); if(!hit)return;
    const step=e.shiftKey?8:1;
    const now=performance.now();
    if(now-lastNudge>800)pushHistory();
    lastNudge=now;
    if(hit.kind==="float"){
      const f=hit.f;
      if(e.altKey){ /* Alt+setas = redimensiona */
        const horiz=e.key==="ArrowRight"||e.key==="ArrowLeft";
        if(e.key==="ArrowRight")f.w+=step; if(e.key==="ArrowLeft")f.w-=step;
        if(e.key==="ArrowDown")f.h+=step; if(e.key==="ArrowUp")f.h-=step;
        f.w=Math.max(36,Math.min(PT_W,Math.round(f.w)));
        f.h=Math.max(36,Math.min(PT_H-SAFE_T,Math.round(f.h)));
        if(f.shape==="round"){const sz=horiz?f.w:f.h;f.w=sz;f.h=sz;} /* driven dimension */
        hudShow(`${f.w} × ${f.h}pt`,f.x,f.y,false,true);
      }else{
        if(e.key==="ArrowRight")f.x+=step; if(e.key==="ArrowLeft")f.x-=step;
        if(e.key==="ArrowDown")f.y+=step; if(e.key==="ArrowUp")f.y-=step;
        f.x=Math.max(0,Math.min(PT_W-f.w,Math.round(f.x)));
        f.y=Math.max(SAFE_T,Math.min(PT_H-f.h,Math.round(f.y)));
        hudShow(`x ${f.x} · y ${f.y}`,f.x,f.y,false,true);
      }
    }else{
      const r=hit.r, b=hit.b;
      if(e.key==="ArrowUp"||e.key==="ArrowDown"){
        if(r.grow){const lr=layoutRows(curScreen())[curScreen().rows.indexOf(r)];
          r.grow=0;r.h=Math.round(lr.h);}
        r.h=Math.max(ROW_MIN,Math.min(500,(r.h||64)+(e.key==="ArrowDown"?step:-step)));
        const li=layoutRows(curScreen()),ri=curScreen().rows.indexOf(r);
        hudShow(`h ${r.h}pt`,PADH,li[ri]?li[ri].y0:SAFE_T,false,true);
      }else{
        const i=r.blocks.indexOf(b);
        const other=r.blocks[i+1]||r.blocks[i-1];
        if(!other){ /* solo: ←→ slide the block through the margins */
          const total=(r.padL||0)+(r.padR||0);
          if(!total){toast("no slack in this row — press F to free the block");return;}
          let pl=(r.padL||0)+(e.key==="ArrowRight"?step:-step);
          pl=Math.max(0,Math.min(total,pl));
          r.padL=pl;r.padR=total-pl;
          const li2=layoutRows(curScreen()),ri2=curScreen().rows.indexOf(r);
          hudShow(`x ${PADH+pl}pt`,PADH+pl,li2[ri2]?li2[ri2].y0:SAFE_T,false,true);
          renderStage(false);scheduleSave();return;
        }
        const ft=r.blocks.reduce((a,x)=>a+(x.flex||1),0);
        const innerW=PT_W-2*PADH-GAP*(r.blocks.length-1);
        const k=ft/innerW;
        const dir=(e.key==="ArrowRight"?1:-1)*(r.blocks[i+1]?1:-1);
        let d=dir*step*k;
        d=Math.max(-((b.flex||1)-0.25),Math.min(d,(other.flex||1)-0.25));
        b.flex=(b.flex||1)+d; other.flex=(other.flex||1)-d;
        const li=layoutRows(curScreen()),ri=curScreen().rows.indexOf(r);
        const lb=li[ri]&&li[ri].blocks.find(x=>x.code===b.id);
        hudShow(`${Math.round(innerW*(b.flex)/ft)}pt`,lb?lb.x0:PADH,li[ri]?li[ri].y0:SAFE_T,false,true);
      }
    }
    renderStage(false); scheduleSave();
  }
});

function dlgShow(html,onAct){
  const d=$("#dlg");
  d.innerHTML=html+`<div style="margin-top:10px;text-align:right"><button class="btn mini" data-k="__x">close</button></div>`;
  d.showModal();
  d.onclick=e=>{
    const k=e.target.dataset?e.target.dataset.k:null;
    if(!k)return;
    if(k==="__x"){d.close();return;}
    if(onAct)onAct(k);
    d.close();
  };
}
let toastT=null;
function toast(t){const e=$("#toast");e.textContent=t;e.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>e.style.opacity=0,2200);}

/* ---------------- diagnostics (v8) ---------------- */
const diag={clicks:0,err:null};
function diagPaint(){
  const d=$("#diag"); if(!d)return;
  if(diag.err){d.className="err";d.textContent="JS ERROR: "+diag.err;}
  else{d.className="";d.textContent=`v27 · js ✓ · canvas clicks: ${diag.clicks} · mode: ${mode}`;}
}
window.addEventListener("error",e=>{diag.err=(e.message||"?")+" @"+(e.lineno||"?");diagPaint();});
window.addEventListener("unhandledrejection",e=>{diag.err=String(e.reason&&e.reason.message||e.reason||"promise");diagPaint();});
stage.addEventListener("pointerdown",()=>{diag.clicks++;diagPaint();},true);
setInterval(diagPaint,1500);

/* ---------------- boot ---------------- */
function refit(){ if(state&&fit()){renderStage(false);} }
window.addEventListener("resize",refit);
try{ new ResizeObserver(refit).observe($("#stageWrap")); }catch(e){}
(async function boot(){
  state=lsGet();
  if(!state||!Array.isArray(state.screens))state=defaultState();
  state=migrate(state);
  if(!state.screens.some(s=>s.id===state.current))state.current=state.screens[0].id;
  fit(true); render(); setChip("● connecting cloud…");
  try{db=await window.claude?.use?.("db");}catch(e){db=null;}
  if(db){
    let cloud=null, gotOk=false;
    try{const s=await db.doc("layout/main").get(); gotOk=true; if(s.exists)cloud=s.data();}catch(e){}
    if(cloud&&Array.isArray(cloud.screens)&&(cloud.updatedAt||0)>=(state.updatedAt||0)){
      /* db snapshots are FROZEN (read-only) — clone before using */
      state=migrate(clone(cloud)); if(!state.screens.some(s=>s.id===state.current))state.current=state.screens[0].id;
      lsSet(state);
    }else if(gotOk&&(state.updatedAt||0)>0){
      /* only push local over the cloud when the read worked AND local has real edits */
      try{await db.doc("layout/main").set(clone(state));}catch(e){}
    }else if(gotOk&&!cloud){
      try{await db.doc("layout/main").set(clone(state));}catch(e){}
    }
    setChip("✓ cloud connected","ok");
  }else setChip("✓ saved locally (no cloud)","warn");
  /* if the state came from v3, persist the migrated version (local and cloud) */
  if(migrated){migrated=false;scheduleSave();toast("layout updated: a single War Room · Front is now Progress");}
  render();
})();
</script>

<script type="text/html" id="src-pil">
<meta charset="utf-8">
<style>
  :host{
    --ground:#0c181b; --panel:#122227; --panel-2:#182d33; --line:#22393f;
    --ink:#e9f0ec; --muted:#93aaa7; --faint:#5f7876;
    --battle:#f7c844; --gain:#46c46a; --gold:#e5b23c;
    --prem:#9b5cf6; --alert:#e03e36; --info:#4aa3d8; --accent:#e88a2d;
    --display:"Barlow Condensed","Arial Narrow",sans-serif;
    --body:"Barlow",-apple-system,"Helvetica Neue",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  :host{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;padding-block:0 64px;padding-inline:20px;}
  .wrap{max-width:900px;margin:0 auto;}
  header.hero{padding:52px 0 6px;}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--battle);margin:0 0 10px;}
  h1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(40px,7.5vw,64px);line-height:.95;margin:0;text-wrap:balance;}
  .lede{color:var(--muted);max-width:64ch;font-size:16.5px;margin:16px 0 0;}
  .lede b{color:var(--ink);font-weight:600;}
  .rule{height:3px;background:linear-gradient(90deg,var(--battle),var(--accent) 40%,transparent 85%);margin-top:26px;border-radius:2px;}

  .part{margin-top:64px;}
  .part-tag{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);}
  .part h2.part-title{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(30px,5.5vw,44px);margin:4px 0 8px;line-height:1;}
  .part .part-sub{color:var(--muted);max-width:64ch;margin:0 0 26px;}
  .part .part-sub b{color:var(--ink);font-weight:600;}

  /* ---- compact pillars ---- */
  .pillars{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:680px){.pillars{grid-template-columns:1fr;}}
  .pil{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;}
  .pil .pcode{font-family:var(--mono);font-size:12px;color:var(--ground);background:var(--battle);padding:2px 7px;border-radius:3px;font-weight:500;}
  .pil h3{font-family:var(--display);text-transform:uppercase;font-size:21px;margin:10px 0 6px;font-weight:700;letter-spacing:.02em;line-height:1.05;}
  .pil p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;}
  .pil p b{color:var(--ink);font-weight:600;}
  .pil .bmk{margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--info);line-height:1.5;}

  /* ---- moves ---- */
  section.mov{margin-top:56px;}
  .mov-head{display:flex;align-items:baseline;gap:13px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;}
  .mov-num{font-family:var(--mono);font-size:13px;color:var(--ground);background:var(--battle);padding:3px 8px;border-radius:3px;font-weight:500;flex:none;transform:translateY(-2px);}
  h2.mov-title{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(24px,4.2vw,32px);letter-spacing:.02em;margin:0;line-height:1.05;text-wrap:balance;}
  .mov .lead{color:var(--muted);margin:0 0 18px;max-width:66ch;font-size:15.5px;}
  .mov .lead b{color:var(--ink);font-weight:600;}
  .why{margin-top:14px;font-size:13.5px;color:var(--faint);line-height:1.55;padding-left:14px;border-left:2px solid var(--line);}
  .why b{color:var(--muted);font-weight:600;}

  .ba{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:680px){.ba{grid-template-columns:1fr;}}
  .ba-col h4{margin:0 0 10px;font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:500;}
  .ba-col.before h4{color:var(--faint);}
  .ba-col.after h4{color:var(--battle);}

  /* tab bars */
  .tabbar{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;}
  .tabbar .t{flex:1;text-align:center;font-family:var(--display);text-transform:uppercase;font-size:13px;letter-spacing:.04em;color:var(--muted);padding:10px 2px;border-radius:5px;line-height:1.1;}
  .tabbar .t.hot{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);}
  .tabbar .t small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;color:var(--faint);text-transform:none;margin-top:3px;}
  .orbit{margin-top:10px;font-size:12.5px;color:var(--faint);line-height:1.6;}
  .orbit b{color:var(--muted);font-weight:600;}

  .map{margin-top:16px;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .map .row{display:grid;grid-template-columns:150px 1fr;border-top:1px solid var(--line);font-size:13.5px;}
  .map .row:first-child{border-top:none;}
  .map .row .dest{background:var(--panel-2);padding:10px 14px;font-family:var(--display);text-transform:uppercase;font-size:16px;letter-spacing:.03em;font-weight:700;}
  .map .row .from{padding:10px 14px;color:var(--muted);background:var(--panel);}
  @media (max-width:560px){.map .row{grid-template-columns:110px 1fr;}}

<div class="wrap">

<header class="hero">
  <p class="eyebrow">Ashes of War · Metagame · Art Direction</p>
  <h1>Metagame UX<br>Pillars &amp; Proposal</h1>
  <p class="lede"><b>The pillars</b>: shared code the market already taught our players. <b>The proposal</b>: six concrete moves on our real screens, each with a before/after and its benchmark.</p>
  <p class="lede" style="font-size:14px;margin-top:10px"><b style="color:#46c46a">✓W</b> = independently confirmed by Watabe's hands-on <a href="https://docs.google.com/document/d/19_VQTApzG40gCWVWse2wBj16uzT4j9LOB4LmwpPMwKk/edit" style="color:#4aa3d8">UX Assessment</a> (Aug 2026).</p>
  <div class="rule"></div>
</header>

<!-- ============ PART 1 ============ -->
<div class="part">
  <span class="part-tag">Part 1</span>
  <h2 class="part-title">The Pillars</h2>
  <p class="part-sub">Six codes to quote in review: <b>convention where the player operates, AoW signature where the player feels.</b></p>

  <div class="pillars">
    <div class="pil"><span class="pcode">P1</span>
      <h3>Battle is the center of gravity</h3>
      <p>One play button per surface; every screen returns to combat in ≤2 taps. Every element gets a <b>priority level</b>: 1st = the screen's goal, 2nd = relevant, 3rd = hidden behind a tap.</p>
      <div class="bmk">↳ Clash Royale · Brawl Stars: giant play button, under the thumb · <b style="color:#46c46a">✓W</b> levels of priority per screen</div>
    </div>
    <div class="pil"><span class="pcode">P2</span>
      <h3>Direction carries meaning</h3>
      <p><b>Up = progress</b> (Trophy Road, leaderboard, positive deltas) · <b>right = time</b> (pass, daily, event) · <b>down = loss/exit</b>.</p>
      <div class="bmk">↳ Trophy Road climbs in CR/BS · rank 1 on top · sheets slide from bottom (iOS/Android) · <b style="color:#46c46a">✓W</b> today TR and BP scroll in opposite directions</div>
    </div>
    <div class="pil"><span class="pcode">P3</span>
      <h3>Every color has one owner</h3>
      <p><b style="color:var(--battle)">Yellow</b> play · <b style="color:var(--gain)">green</b> gain/claim · <b style="color:var(--gold)">gold</b> value (never a button) · <b style="color:var(--prem)">purple</b> premium · <b style="color:var(--alert)">red</b> alert · <b style="color:var(--info)">blue</b> info. Rarity gray→blue→purple→gold. <b>Value palette</b>: luminance by role, so hierarchy survives in grayscale.</p>
      <div class="bmk">↳ Supercell's color map · mid-core rarity standard · <b style="color:#46c46a">✓W</b> red=destructive, green=positive, value palette</div>
    </div>
    <div class="pil"><span class="pcode">P4</span>
      <h3>Short paths, clean home</h3>
      <p>Fewer taps through <b>contextual shortcuts</b> — never through more fixed buttons. Play in 1 tap, collect in 1, upgrade in 2. And a <b>reach map</b>: a button's importance is inversely proportional to its distance from the thumb — primary actions dock to the bottom, rare/dangerous ones live deliberately far, at the top.</p>
      <div class="bmk">↳ the genre ceiling: Clash Royale · thumb-zone ergonomics (one-handed play)</div>
    </div>
    <div class="pil"><span class="pcode">P5</span>
      <h3>A badge is a promise</h3>
      <p>A red dot only when there is a real, executable gain waiting right now. Urgency lives in the countdown, not in the badge.</p>
      <div class="bmk">↳ Supercell discipline — not the 4X noise (a different session format from ours)</div>
    </div>
    <div class="pil"><span class="pcode">P6</span>
      <h3>One grammar, many systems</h3>
      <p>Track, card and claim are single components reused by pass, event, daily, Trophy Road and campaign — each dressed as an operation. Same for <b>UI responses</b>: one popup standard, one close pattern (today: 3), one toggle behavior.</p>
      <div class="bmk">↳ Supercell's silent economy for years · <b style="color:#46c46a">✓W</b> standardize responses & close patterns</div>
    </div>
  </div>
</div>

<!-- ============ PART 2 ============ -->
<div class="part">
  <span class="part-tag">Part 2</span>
  <h2 class="part-title">The Proposal</h2>
  <p class="part-sub">Six moves on what already exists (build v0.12 · wireframe board), in attack order. <b>Bets to discuss.</b></p>
</div>

<!-- M1 -->
<section class="mov">
  <div class="mov-head"><span class="mov-num">01</span><h2 class="mov-title">From 16 loose destinations to 5 territories</h2></div>
  <p class="lead">The home radiates into <b>16+ destinations</b>, and 2 of the 5 tabs do the same mental task ("prepare my army") while events, Trophy Road, rank and campaign hang off scattered icons. Highest-leverage move.</p>
  <div class="ba">
    <div class="ba-col before"><h4>Today</h4>
      <div class="tabbar">
        <div class="t">Shop</div><div class="t">Season</div><div class="t hot">Battle</div><div class="t">Factions</div><div class="t">Abilities</div>
      </div>
      <p class="orbit"><b>Loose orbit:</b> event (home card) · Trophy Road (🏆 button, right of START BATTLE) · custom battle (radar button, left of it) · PvE campaign (inside Factions) · profile, achievements, leaderboard, news, settings (scattered — some with no captured entry)</p>
    </div>
    <div class="ba-col after"><h4>Proposal</h4>
      <div class="tabbar">
        <div class="t">Shop<small>offers · crates</small></div>
        <div class="t">Army<small>factions · units · abilities · campaign</small></div>
        <div class="t hot">Battle<small>war room</small></div>
        <div class="t">Progress<small>pass · trophy road · ranks</small></div>
        <div class="t">Events<small>siege · tournaments</small></div>
      </div>
      <p class="orbit"><b>Home corners (low frequency):</b> profile + customization · mail · news · settings</p>
    </div>
  </div>
  <div class="map">
    <div class="row"><div class="dest">Army</div><div class="from">Factions + Abilities (one choice depends on the other) + the faction's PvE campaign</div></div>
    <div class="row"><div class="dest">Progress</div><div class="from">Pass + Trophy Road + leaderboards + achievements — all long-term progression, climbing upward (P2)</div></div>
    <div class="row"><div class="dest">Events</div><div class="from">Siege + tournaments + custom battle; no live event → next one with countdown</div></div>
  </div>
  <p class="why"><b>Reference:</b> CR and Brawl Stars both paid for this remodel post-launch; we ship consolidated. <b style="color:#46c46a">✓W</b> proposes the same swap: leaderboard out, Events in.</p>
</section>

<!-- M2 -->
<section class="mov">
  <div class="mov-head"><span class="mov-num">02</span><h2 class="mov-title">Home = War Room: loadout fused to the button</h2></div>
  <p class="lead">On today's home the faction and the abilities are two chips floating over the hero art, and START BATTLE shares its row with two side buttons. Fuse the two chips into one <b>loadout strip</b> docked to a full-width button — "what am I fighting with" in the same glance that fires the fight.</p>
  <div class="ba">
    <div class="ba-col before"><h4>Today · build v0.12</h4>
      <div class="phone">
        <div class="ph bar">★ 30 · ⬤ 977 · ◆ 76</div>
        <div class="ph bar" style="height:18px;font-size:8px">✉ mail · ⚙ settings</div>
        <div class="ph-row"><div class="ph card">surtado<br>🏆 5,310</div><div class="ph card">premium pass<br>tier 20 · 130/180 xp</div></div>
        <div class="ph promo-e">☣ outbreak · event over! · 🎟 4</div>
        <div class="ph hero">faction hero art
          <span class="over">abilities [A][B] &nbsp;·&nbsp; justice division 🏆 1,598 · rank 2<br>two chips floating on top</span></div>
        <div class="ph chests">daily win rewards · 6 crates ✓ · refreshes in 5h 56m</div>
        <div class="ph-row"><div class="ph sq">((•))</div><div class="ph cta-y" style="height:48px">start battle</div><div class="ph sq">🏆</div></div>
        <div class="ph tabs">shop ① · season · battle · factions · abilities</div>
      </div>
      <p class="cap">The loadout is split into two chips over the hero, and the play button shares its row with 2 others — 4 things fighting for the same glance.</p>
    </div>
    <div class="ba-col after"><h4>Proposal</h4>
      <div class="phone">
        <div class="ph bar">avatar · trophies · 3 currencies — ZONE C: read, rarely tap</div>
        <div class="ph hero">living faction hero art<br>(war room · idle animation)</div>
        <div class="ph-row"><div class="ph promo-e">event</div><div class="ph promo-p">pass</div></div>
        <div class="ph chests ready">daily rewards · ready crate = green — ZONE B</div>
        <div class="ph loadout">⬡ faction · [ability][ability] · swap</div>
        <div class="ph cta-y">START BATTLE — ZONE A: docked to the thumb</div>
        <div class="ph tabs">5 tabs</div>
      </div>
      <p class="cap"><b>Loadout + button = one block in the thumb zone</b> (P4). Max 2 promos; the ready crate is the only green.</p>
    </div>
  </div>
  <p class="why"><b>Reference:</b> CR keeps the deck off the home. The strip gives us that <b>without hiding faction identity</b> (hero art swaps with it — our signature).</p>
</section>

<!-- M3 -->
<section class="mov">
  <div class="mov-head"><span class="mov-num">03</span><h2 class="mov-title">One ladder per surface</h2></div>
  <p class="lead"><b>Five progression numbers</b> today — trophies, faction rank, faction level, season XP, stars — with trophies repeated 3× on the main menu <b style="color:#46c46a">✓W</b>. Proposal: <b>one ladder per surface.</b></p>
  <div class="map">
    <div class="row"><div class="dest">Home</div><div class="from"><b>Account trophies</b> — the war ladder (Trophy Road/frontline), the one number every match moves.</div></div>
    <div class="row"><div class="dest">Army</div><div class="from"><b>Faction mastery</b> — rank + level live in the faction card, never on the home.</div></div>
    <div class="row"><div class="dest">Progress</div><div class="from"><b>Season XP</b> — only on the pass bar. <b>Stars</b> get a sink or leave the top bar.</div></div>
  </div>
  <p class="why"><b>Reference:</b> CR's trophies + Path of Legends confusion is the cautionary tale; Brawl Stars' trophies vs. mastery split is the solution we copy.</p>
</section>

<!-- M4 -->
<section class="mov">
  <div class="mov-head"><span class="mov-num">04</span><h2 class="mov-title">A post-match that acts, not just informs</h2></div>
  <p class="lead">With ~4-minute matches, post-match is <b>the most-seen screen in the metagame</b>. Design it as a 4-beat ritual, crossable in seconds, last beat actionable.</p>
  <div class="steps">
    <div class="s"><b>1 · Result</b>Trophy delta animating up (win) or down (loss) — P2, literally.<span class="k">DEFEAT: SHORT PATH, NO UPSELL</span></div>
    <div class="s"><b>2 · Tracks advance</b>Daily moves + pass bar fills in front of the player — both on the single track grammar (P6).</div>
    <div class="s"><b>3 · Loot</b>Blueprints and gold. Here enters the <b>hidden-rarity drop</b> — an armored supply crate cracked open tap by tap.</div>
    <div class="s act"><b>4 · Next order</b>"Assault reached 8/8" → the upgrade button <b>right there</b>, 1 tap, no trip to the collection. Then back to the War Room.<span class="k">← THE INNOVATION: THE BENCHMARK ONLY INFORMS</span></div>
  </div>
  <p class="why"><b>Reference:</b> beats = CR/BS; the hidden-rarity drop = Starr Drop (2023), already copied by CR. Beat 4 is where we pass the benchmark.</p>
</section>

<!-- M5 -->
<section class="mov">
  <div class="mov-head"><span class="mov-num">05</span><h2 class="mov-title">A collection that points to the next step</h2></div>
  <p class="lead">The build's unit modal (‹ › arrows) is a catalog to leaf through. The player wants one answer: <b>"what can I improve right now?"</b></p>
  <div class="ba">
    <div class="ba-col before"><h4>Today (build v0.12)</h4>
      <p class="orbit" style="margin-top:0">Arrow through units one by one; the payable state looks like everything else.</p>
    </div>
    <div class="ba-col after"><h4>Proposal</h4>
      <p class="orbit" style="margin-top:0"><b>Sort by "actionable first":</b> payable upgrades on top in green (P3), then "almost there", then the rest. Army badge only when something is payable (P5).</p>
    </div>
  </div>
  <p class="why"><b>Reference:</b> CR's "upgrade available" filter + BS's pending-progress spotlight — the pattern that turns a collection into a <b>queue of decisions</b>.</p>
</section>

<!-- M6 -->
<section class="mov">
  <div class="mov-head"><span class="mov-num">06</span><h2 class="mov-title">Events and campaign as operations</h2></div>
  <p class="lead">Siege and the PvE campaign are each being born with their own layout. Run both (plus pass and daily) on <b>one track component</b>, dressed as a military operation.</p>
  <div class="map">
    <div class="row"><div class="dest">Event</div><div class="from">Horizontal track (P2) + own leaderboard; teaser countdown between events.</div></div>
    <div class="row"><div class="dest">Campaign</div><div class="from">Lives on the faction card, pays that faction's blueprints — <b>PvE purpose</b> for no-PvP days.</div></div>
    <div class="row"><div class="dest">Cost</div><div class="from">Built once → every new event is <b>content + skin</b>, not a new system.</div></div>
  </div>
  <p class="why"><b>Reference:</b> Supercell's one-anatomy passes/events. The operation skin is AoW signature at zero usability cost.</p>
</section>

<section class="mov">
  <div class="mov-head"><span class="mov-num" style="background:#46c46a">✓W</span><h2 class="mov-title">Quick wins from the UX assessment</h2></div>
  <p class="lead">Small fixes that don't wait for the big moves:</p>
  <div class="map">
    <div class="row"><div class="dest">Close</div><div class="from">One close pattern per surface (today: 3) — ❌ popups, ↩ fullscreen.</div></div>
    <div class="row"><div class="dest">Task Log</div><div class="from">BP task-log doesn't look tappable — missions hidden. Real button affordance.</div></div>
    <div class="row"><div class="dest">Settings</div><div class="from">Same-looking buttons behave differently. One look per behavior.</div></div>
    <div class="row"><div class="dest">Store</div><div class="from">Offer timer sits in its own corner — one timer position store-wide.</div></div>
  </div>
</section>

<script>
/* ---------------- hub: 4 views in a single link ----------------
   The documents (pillars, today×proposal, flow) mount in a shadow DOM — CSS isolated from the Lab, zero class collisions. */
(function(){
  var mounted={};
  function mount(id,srcId){
    if(mounted[id])return;
    var host=document.getElementById(id);
    var sh=host.attachShadow?host.attachShadow({mode:"open"}):null;
    var html=document.getElementById(srcId).textContent;
    if(sh)sh.innerHTML=html; else host.innerHTML=html;
    mounted[id]=true;
  }
  function show(v){
    document.getElementById("v-pil").classList.toggle("on",v==="pil");
    document.getElementById("v-cmp").classList.toggle("on",v==="cmp");
    document.getElementById("v-flx").classList.toggle("on",v==="flx");
    document.getElementById("labwrap").classList.toggle("on",v==="lab");
    document.body.classList.toggle("labon",v==="lab");
    document.querySelectorAll("#hubnav .hv").forEach(function(b){b.classList.toggle("on",b.dataset.v===v);});
    if(v==="pil")mount("v-pil","src-pil");
    if(v==="cmp")mount("v-cmp","src-cmp");
    if(v==="flx")mount("v-flx","src-flx");
    if(v==="lab"&&window.fit){try{fit(true);render();}catch(e){}}
    try{localStorage.setItem("mlabView",v);}catch(e){}
  }
  document.querySelectorAll("#hubnav .hv").forEach(function(b){
    b.addEventListener("click",function(){show(b.dataset.v);});
  });
  var start="cmp";
  try{var sv=localStorage.getItem("mlabView"); if(sv==="pil"||sv==="cmp"||sv==="flx"||sv==="lab")start=sv;}catch(e){}
  show(start);
  window.addEventListener("resize",function(){
    if(document.getElementById("labwrap").classList.contains("on")&&window.fit){try{if(fit())renderStage(false);}catch(e){}}
  });
})();
</script>
