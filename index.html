/* Keys that belong to the block itself, not to its look */
const BEHAVIOUR_KEYS = ["link", "fid", "does", "note", "tags"];

/* ---- 40-store.js ---- */
/* =====================================================================
   40 · STORE — one place that owns the boards, saves them and undoes.
   Cloud (artifact db):   boards/<id>  + boards/<id>/screens/<sid>
                          variants/<id> + variants/<id>/screens/<sid>
   Editors write boards/, anyone who can use the page writes variants/.
   Without a cloud (GitHub Pages, a saved file) everything lives in this
   browser. Every edit goes through Store.edit → history → autosave.
   ===================================================================== */
const Store = {
  db: null, user: null, me: null,
  canBoards: true,        /* may write Today / Proposal (editors) */
  canShare: true,         /* may write variants / renders / refs */
  cloud: false,
  boards: {}, order: [],
  defaults: {},           /* pristine built-in boards, for "reset" */
  dirty: new Map(),       /* key "bid|sid" or "bid|" → true */
  inflight: new Set(), myRevs: new Set(),
  status: "local", lastSaved: 0, subs: [],
  undoStack: [], redoStack: [],
  story: {},              /* editable Story text overrides */
};

const LS_KEY = "aowlab5.state";
const colOf = b => (b.kind === "variant" ? "variants" : "boards");

function storeInitDefaults() {
  [TODAY, PROPOSAL].forEach(b => { Store.defaults[b.id] = normBoard(clone(b)); });
  Store.boards = { today: clone(Store.defaults.today), proposal: clone(Store.defaults.proposal) };
  Store.order = ["today", "proposal"];
}
function B(id) { return Store.boards[id]; }
function S(bid, sid) { return screenById(Store.boards[bid], sid); }

/* A saved copy of Today / Proposal (cloud or browser) predates screens added
   to the built-in data later: add those, next to their built-in neighbours.
   Screens the person already has are never touched; `staleFrom` lets the
   inspector offer “Reset to built-in” on screens updated since. */
function upgradeBuiltin(b, storedRev) {
  const d = Store.defaults[b.id];
  if (!d || b.kind === "variant") return;
  const rev = storedRev || 1;
  if (rev < DATA_REV) {
    d.screens.forEach((ds, i) => {
      if ((ds.since || 1) <= rev || b.screens.some(s => s.id === ds.id)) return;
      let at = -1;
      for (let j = i - 1; j >= 0 && at < 0; j--) at = b.screens.findIndex(s => s.id === d.screens[j].id);
      b.screens.splice(at < 0 ? b.screens.length : at + 1, 0, clone(ds));
    });
    b.staleFrom = rev;
  }
  b.dataRev = DATA_REV;
}
/* is there a newer built-in version of this screen than the saved copy? */
function builtinNewer(bid, sid) {
  const b = B(bid), d = Store.defaults[bid] && screenById(Store.defaults[bid], sid);
  return !!(b && d && b.staleFrom && (d.rev || 1) > b.staleFrom);
}

/* ---------------- editing API ---------------- */
function snapshotScreen(bid, sid) { const s = S(bid, sid); return s ? JSON.stringify(s) : null; }
function snapshotBoard(bid) { const b = B(bid); return b ? JSON.stringify(b) : null; }

/* atomic screen edit with history; consecutive edits with the same `merge` key coalesce */
function edit(bid, sid, label, fn, merge) {
  const before = snapshotScreen(bid, sid);
  if (before == null) return;
  fn(S(bid, sid));
  normScreen(S(bid, sid));
  commitScreen(bid, sid, label, before, merge);
}
function beginScreen(bid, sid) { return { bid, sid, before: snapshotScreen(bid, sid) }; }
function commitScreen(bid, sid, label, before, merge) {
  const after = snapshotScreen(bid, sid);
  if (after === before) return false;
  const top = Store.undoStack[Store.undoStack.length - 1];
  if (merge && top && top.merge === merge && top.sid === sid && top.bid === bid && Date.now() - top.t < 1200) {
    top.after = after; top.t = Date.now();
  } else {
    Store.undoStack.push({ kind: "screen", bid, sid, before, after, label, merge, t: Date.now() });
    if (Store.undoStack.length > 150) Store.undoStack.shift();
  }
  Store.redoStack = [];
  markDirty(bid, sid);
  Bus.emit("change", { bid, sid, label });
  return true;
}
/* structural edit: screens added / removed / reordered, board renamed */
function editBoard(bid, label, fn) {
  const before = snapshotBoard(bid);
  fn(B(bid));
  normBoard(B(bid));
  const after = snapshotBoard(bid);
  if (after === before) return;
  Store.undoStack.push({ kind: "board", bid, before, after, label, t: Date.now() });
  Store.redoStack = [];
  markBoardDirty(bid, JSON.parse(before), B(bid));
  Bus.emit("change", { bid, label, structural: true });
}
function applyHistory(entry, dir) {
  const json = dir === "undo" ? entry.before : entry.after;
  if (entry.kind === "screen") {
    const b = B(entry.bid); if (!b) return;
    const i = b.screens.findIndex(s => s.id === entry.sid);
    const scr = JSON.parse(json);
    if (i >= 0) b.screens[i] = scr; else b.screens.push(scr);
    markDirty(entry.bid, entry.sid);
  } else {
    const prev = B(entry.bid) ? clone(B(entry.bid)) : null;
    Store.boards[entry.bid] = JSON.parse(json);
    if (prev) markBoardDirty(entry.bid, prev, Store.boards[entry.bid]);
  }
  Bus.emit("change", { bid: entry.bid, sid: entry.sid, label: (dir === "undo" ? "Undo " : "Redo ") + entry.label, structural: entry.kind === "board" });
}
function undo() {
  const e = Store.undoStack.pop(); if (!e) return toast("Nothing to undo");
  applyHistory(e, "undo"); Store.redoStack.push(e); toast("Undo · " + e.label);
}
function redo() {
  const e = Store.redoStack.pop(); if (!e) return toast("Nothing to redo");
  applyHistory(e, "redo"); Store.undoStack.push(e); toast("Redo · " + e.label);
}

/* ---------------- boards: variants, reset, versions ---------------- */
function canWrite(bid) {
  const b = B(bid);
  if (!b) return false;
  if (!Store.cloud) return true;
  return b.kind === "variant" ? Store.canShare : Store.canBoards;
}
function createVariant(fromBid, name, screensOverride) {
  const src = B(fromBid) || { name: "Variant", start: null, screens: [] };
  const id = "v" + uid("");
  const b = normBoard({
    id, name: name || (src.name + " · copy"), kind: "variant", start: src.start,
    from: fromBid || null, createdAt: Date.now(), createdBy: Store.me || null,
    screens: clone(screensOverride || src.screens),
  });
  Store.boards[id] = b; Store.order.push(id);
  markBoardDirty(id, null, b);
  Bus.emit("change", { bid: id, structural: true, label: "New variant" });
  return id;
}
async function deleteVariant(bid) {
  const b = B(bid); if (!b || b.kind !== "variant") return;
  delete Store.boards[bid]; Store.order = Store.order.filter(x => x !== bid);
  if (Store.cloud) {
    try {
      const col = Store.db.collection("variants/" + bid + "/screens");
      const snap = await col.get();
      for (const d of snap.docs) await col.doc(d.id).delete();
      await Store.db.doc("variants/" + bid).delete();
    } catch (e) { console.warn(e); toast("Could not delete in the cloud: " + (e.code || e.message)); }
  }
  persistLocal();
  Bus.emit("change", { bid, structural: true, label: "Delete variant" });
}
function resetScreen(bid, sid) {
  const src = Store.defaults[bid] || Store.defaults[(B(bid) || {}).from] || Store.defaults.proposal;
  const d = screenById(src, sid);
  if (!d) return toast("This screen has no built-in version to go back to");
  edit(bid, sid, "Reset screen", s => { Object.keys(s).forEach(k => delete s[k]); Object.assign(s, clone(d)); });
}
async function saveVersion(bid, name) {
  const b = B(bid);
  const rec = { boardId: bid, boardName: b.name, name: name || ("Version " + new Date().toLocaleString()), at: Date.now(), by: Store.me || null, board: clone(b) };
  if (Store.cloud && Store.db) {
    const js = JSON.stringify(rec);
    if (js.length > 250000) return toast("This board is too large for one snapshot — export it as JSON instead");
    try { await Store.db.collection("versions").doc(uid("ver")).set(rec); toast("Version saved"); }
    catch (e) { toast("Could not save the version: " + (e.code || e.message)); }
  } else {
    const list = LS.get("aowlab5.versions", []); list.unshift(rec); LS.set("aowlab5.versions", list.slice(0, 12)); toast("Version saved in this browser");
  }
}
async function listVersions() {
  if (Store.cloud && Store.db) {
    try { const snap = await Store.db.collection("versions").orderBy("at", "desc").limit(40).get(); return snap.docs.map(d => Object.assign({ id: d.id }, d.data())); }
    catch (e) { return []; }
  }
  return LS.get("aowlab5.versions", []).map((v, i) => Object.assign({ id: "local" + i }, v));
}
function restoreVersion(v) {
  const bid = v.boardId;
  if (!B(bid)) { Store.boards[bid] = normBoard(clone(v.board)); Store.order.push(bid); markBoardDirty(bid, null, Store.boards[bid]); }
  else editBoard(bid, "Restore " + v.name, b => { Object.assign(b, clone(v.board)); });
  Bus.emit("change", { bid, structural: true, label: "Restore version" });
}

/* ---------------- autosave ---------------- */
function markDirty(bid, sid) { Store.dirty.set(bid + "|" + (sid || ""), true); scheduleSave(); }
function markBoardDirty(bid, before, after) {
  Store.dirty.set(bid + "|", true);
  const bs = new Set(((before && before.screens) || []).map(s => s.id));
  const as = new Set(((after && after.screens) || []).map(s => s.id));
  (after ? after.screens : []).forEach(s => { const o = before && screenById(before, s.id); if (!o || JSON.stringify(o) !== JSON.stringify(s)) Store.dirty.set(bid + "|" + s.id, true); });
  bs.forEach(id => { if (!as.has(id)) Store.dirty.set(bid + "|-" + id, true); });   /* removal */
  scheduleSave();
}
const scheduleSave = debounce(() => flushSave(), 900);
function setStatus(st) { Store.status = st; Bus.emit("status", st); }

async function flushSave() {
  if (!Store.dirty.size) return;
  persistLocal();
  if (!Store.cloud || !Store.db) { Store.dirty.clear(); Store.lastSaved = Date.now(); setStatus("local"); return; }
  const keys = [...Store.dirty.keys()]; Store.dirty.clear();
  setStatus("saving");
  let failed = 0;
  for (const k of keys) {
    const [bid, rest] = k.split("|");
    const b = B(bid);
    if (!canWrite(bid) && b) { continue; }
    const col = colOf(b || { kind: bid.startsWith("v") ? "variant" : "board" });
    try {
      if (!rest) {
        if (!b) continue;
        await Store.db.doc(col + "/" + bid).set({ id: bid, name: b.name, kind: b.kind, start: b.start, order: b.screens.map(s => s.id), from: b.from || null, note: b.note || "", createdAt: b.createdAt || null, createdBy: b.createdBy || null, dataRev: DATA_REV, updatedAt: Date.now() });
        if (!Store.boardMetaSaved[bid]) { Store.boardMetaSaved[bid] = true; if (Store.watchScreens) Store.watchScreens(b); }
      } else if (rest.startsWith("-")) {
        await Store.db.doc(col + "/" + bid + "/screens/" + rest.slice(1)).delete();
      } else {
        const s = S(bid, rest); if (!s) continue;
        const rev = uid("r"); Store.myRevs.add(rev);
        const body = Object.assign(clone(s), { rev, updatedAt: Date.now(), by: Store.me || null });
        if (JSON.stringify(body).length > 250000) { toast("Screen “" + s.name + "” is too large to save — remove images or blocks"); failed++; continue; }
        await Store.db.doc(col + "/" + bid + "/screens/" + rest).set(body);
        if (!Store.boardMetaSaved[bid] && !keys.includes(bid + "|")) Store.dirty.set(bid + "|", true);
      }
    } catch (e) {
      console.warn("save", k, e);
      if (e && e.code === "invalid_argument") {        /* refused by the access rules: stop retrying */
        if (b && b.kind === "variant") { Store.canShare = false; toast("Your access is view-only, so this variant can't be saved — ask the owner for “Can interact”."); }
        else { Store.canBoards = false; toast("Only editors change Today and Proposal — make a variant (Board ▾) to try your own."); }
        Bus.emit("status", Store.status);
        continue;
      }
      failed++;
      Store.dirty.set(k, true);
    }
  }
  if (Store.dirty.size && !failed) return flushSave();
  if (failed) { setStatus("error"); setTimeout(scheduleSave, 6000); }
  else { Store.lastSaved = Date.now(); setStatus("saved"); }
}
Store.boardMetaSaved = {};

/* In this browser, Today / Proposal keep only the screens someone edited;
   the others are stored as {id, builtin} and always follow the built-in data. */
function packBoards() {
  const out = {};
  Object.values(Store.boards).forEach(b => {
    const d = Store.defaults[b.id];
    if (!d || b.kind === "variant") { out[b.id] = b; return; }
    out[b.id] = Object.assign({}, b, { screens: b.screens.map(s => {
      const ds = screenById(d, s.id);
      return ds && JSON.stringify(ds) === JSON.stringify(s) ? { id: s.id, builtin: true } : s;
    }) });
  });
  return out;
}
function unpackBoard(b) {
  const d = Store.defaults[b.id];
  if (!d || b.kind === "variant") return b;
  b.screens = (b.screens || []).map(s => (s && s.builtin ? (screenById(d, s.id) ? clone(screenById(d, s.id)) : null) : s)).filter(Boolean);
  return b;
}
function persistLocal() {
  LS.set(LS_KEY, { v: 5, dataRev: DATA_REV, at: Date.now(), order: Store.order, boards: packBoards(), story: Store.story, features: CUSTOM_FEATURES });
}
function loadLocal() {
  const st = LS.get(LS_KEY);
  if (!st || st.v !== 5 || !st.boards) return false;
  applyState(st);
  return true;
}
function applyState(st) {
  Object.values(st.boards || {}).forEach(b => { Store.boards[b.id] = normBoard(unpackBoard(clone(b))); upgradeBuiltin(Store.boards[b.id], st.dataRev || b.dataRev); });
  Store.order = (st.order || Object.keys(Store.boards)).filter(id => Store.boards[id]);
  ["today", "proposal"].forEach(id => { if (!Store.order.includes(id)) Store.order.unshift(id); });
  if (st.story) Store.story = clone(st.story);
  if (st.features) Object.entries(st.features).forEach(([k, v]) => { CUSTOM_FEATURES[k] = v; FEATURES[k] = FEATURES[k] || v; });
}

/* ---------------- cloud: load + live updates ---------------- */
async function cloudConnect() {
  const db = await claude.use("db").catch(() => null);
  if (!db) return false;
  Store.db = db;
  const user = await claude.use("user").catch(() => null);
  Store.user = user;
  if (user) {
    try { Store.me = await user.id(); } catch (e) {}
    try {
      const owner = await user.isOwner(), ed = await user.canEdit();
      Store.canBoards = !!(owner || ed);   /* boards/ is admin-only (see the db rules) */
      Store.canShare = true;               /* variants/renders/refs: anyone who can interact; a refused write decides */
    } catch (e) {}
  }
  Store.cloud = true;
  setStatus("syncing");
  /* first read: metas of boards and variants, then screens */
  try {
    const [bm, vm] = await Promise.all([db.collection("boards").get(), db.collection("variants").get()]);
    const metas = bm.docs.concat(vm.docs).map(d => d.data()).filter(m => m && m.id);
    for (const m of metas) {
      const col = m.kind === "variant" ? "variants" : "boards";
      const snap = await db.collection(col + "/" + m.id + "/screens").get();
      mergeBoardFromCloud(m, snap.docs.map(d => d.data()));
      Store.boardMetaSaved[m.id] = true;
    }
    const lab = await db.doc("lab/meta").get();
    if (lab.exists) { const d = lab.data(); if (d.story) Store.story = clone(d.story); if (d.features) Object.entries(d.features).forEach(([k, v]) => { CUSTOM_FEATURES[k] = v; FEATURES[k] = FEATURES[k] || v; }); }
  } catch (e) { console.warn("cloud load", e); setStatus("error"); }
  subscribeCloud();
  setStatus("saved");
  return true;
}
function mergeBoardFromCloud(meta, screens) {
  const id = meta.id;
  let b = Store.boards[id];
  if (!b) {
    if (meta.kind !== "variant" && Store.defaults[id]) b = clone(Store.defaults[id]);
    else b = { id, name: meta.name, kind: meta.kind || "variant", start: meta.start, screens: [] };
    Store.boards[id] = b;
    if (!Store.order.includes(id)) Store.order.push(id);
  }
  b.name = meta.name || b.name; b.kind = meta.kind || b.kind; b.start = meta.start || b.start;
  b.from = meta.from || b.from; b.note = meta.note != null ? meta.note : b.note; b.createdAt = meta.createdAt || b.createdAt; b.createdBy = meta.createdBy || b.createdBy;
  const byId = {};
  b.screens.forEach(s => (byId[s.id] = s));
  screens.forEach(s => { if (s && s.id) { const c = clone(s); delete c.rev; delete c.updatedAt; delete c.by; byId[s.id] = c; } });
  const order = Array.isArray(meta.order) && meta.order.length ? meta.order.slice() : Object.keys(byId);
  screens.forEach(s => { if (s && s.id && !order.includes(s.id)) order.push(s.id); });   /* saved, but not in the order yet */
  b.screens = order.map(sid => byId[sid]).filter(Boolean);
  upgradeBuiltin(b, meta.dataRev);
  normBoard(b);
}
function subscribeCloud() {
  const db = Store.db;
  Store.subs.forEach(u => { try { u(); } catch (e) {} }); Store.subs = [];
  const watchMeta = col => Store.subs.push(db.collection(col).onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      const m = ch.doc.data(); if (!m || !m.id) return;
      if (ch.type === "removed") { if (m.kind === "variant" && Store.boards[m.id] && !hasDirty(m.id)) { delete Store.boards[m.id]; Store.order = Store.order.filter(x => x !== m.id); Bus.emit("remote", { bid: m.id }); } return; }
      if (hasDirty(m.id)) return;
      const b = Store.boards[m.id];
      if (!b) { watchScreens(m); return; }
      if (Array.isArray(m.order)) {
        const known = new Map(b.screens.map(s => [s.id, s]));
        const same = m.order.join() === b.screens.map(s => s.id).join();
        if (!same) { b.screens = m.order.map(id => known.get(id)).filter(Boolean); upgradeBuiltin(b, m.dataRev); }
      }
      if (m.name && m.name !== b.name) b.name = m.name;
      if (m.start) b.start = m.start;
      Bus.emit("remote", { bid: m.id });
    });
  }, e => console.warn("meta sub", col, e)));
  const watchScreens = meta => {
    const col = (meta.kind === "variant" ? "variants" : "boards") + "/" + meta.id + "/screens";
    if (Store.subs.length > 50) return;
    Store.subs.push(db.collection(col).onSnapshot(snap => {
      let changed = false;
      snap.docChanges().forEach(ch => {
        const d = ch.doc.data(); if (!d || !d.id) return;
        if (d.rev && Store.myRevs.has(d.rev)) return;
        if (Store.dirty.has(meta.id + "|" + d.id)) return;
        let b = Store.boards[meta.id];
        if (!b) { mergeBoardFromCloud(meta, [d]); changed = true; return; }
        const i = b.screens.findIndex(s => s.id === d.id);
        if (ch.type === "removed") { if (i >= 0) { b.screens.splice(i, 1); changed = true; } return; }
        const c = clone(d); delete c.rev; delete c.updatedAt; delete c.by;
        if (i >= 0) { if (JSON.stringify(b.screens[i]) !== JSON.stringify(normScreen(c))) { b.screens[i] = c; changed = true; } }
        else { b.screens.push(normScreen(c)); changed = true; }
      });
      if (changed) Bus.emit("remote", { bid: meta.id });
    }, e => console.warn("screens sub", col, e)));
  };
  watchMeta("boards"); watchMeta("variants");
  Object.values(Store.boards).forEach(b => { if (Store.boardMetaSaved[b.id]) watchScreens(b); });
  Store.watchScreens = watchScreens;
}
function hasDirty(bid) { for (const k of Store.dirty.keys()) if (k.startsWith(bid + "|")) return true; return false; }

async function saveLabMeta() {
  persistLocal();
  if (!Store.cloud || !Store.canBoards) return;
  try { await Store.db.doc("lab/meta").set({ v: 5, story: Store.story, features: CUSTOM_FEATURES, updatedAt: Date.now() }); }
  catch (e) { console.warn(e); }
}
const saveLabMetaSoon = debounce(saveLabMeta, 800);

/* ---------------- import / export ---------------- */
function exportState() { return { app: "aow-metagame-lab", v: 5, dataRev: DATA_REV, at: Date.now(), order: Store.order, boards: Store.boards, story: Store.story, features: CUSTOM_FEATURES }; }
function importState(obj, mode) {
  if (!obj || obj.v !== 5 || !obj.boards) throw new Error("This file is not a Metagame Lab v5 export");
  if (mode === "variants") {
    Object.values(obj.boards).forEach(b => createVariant(null, (b.name || "Imported") + " (imported)", b.screens));
  } else {
    const before = clone(Store.boards);
    applyState(obj);
    Object.values(Store.boards).forEach(b => markBoardDirty(b.id, before[b.id] || null, b));
  }
  Bus.emit("change", { structural: true, label: "Import" });
}

/* =====================================================================
   50 · LAB — the editor canvas. Free positioning with smart guides,
   8-handle resize, marquee and shift multi-select, groups, alt-drag
   duplicate, copy/paste across screens and boards, full keyboard.
   Modes: edit · play (prototype) · explain (what each button does).
   ===================================================================== */
const L = {
  mode: "edit", sel: new Set(), deep: false, zoom: null, z: 1, snap: true, grid: 4,
  clip: null, drag: null, hover: null, playStack: [], editing: null, trace: true,
};
const cur = () => S(App.bid, App.sid) || (B(App.bid) || {}).screens?.[0];
const curBoard = () => B(App.bid);
const selBlocks = () => { const s = cur(); return s ? s.blocks.filter(b => L.sel.has(b.id)) : []; };
const blockById = id => (cur() || { blocks: [] }).blocks.find(b => b.id === id);

function labMount() {
  const root = $("#v-lab");
  root.innerHTML = `
  <div class="lab-bar">
    <div class="lab-bar-l">
      <div class="lab-toggles"><button class="btn ghost" id="railTog" title="Screens, layers and pieces">☰</button><button class="btn ghost" id="inspTog" title="Inspector">⚙</button></div>
      <button class="btn ghost" id="labUndo" title="Undo (⌘Z)">↶</button>
      <button class="btn ghost" id="labRedo" title="Redo (⇧⌘Z)">↷</button>
      <span class="sep"></span>
      <div class="modes" role="tablist" aria-label="Mode">
        <button class="mode on" data-mode="edit" title="Edit (V)">Edit</button>
        <button class="mode" data-mode="play" title="Play the prototype (P)">Play</button>
        <button class="mode" data-mode="explain" title="What each button does (E)">Explain</button>
      </div>
      <span class="sep"></span>
      <button class="btn ghost tog on" id="labSnap" title="Snap to guides and grid (G)">Snap</button>
      <button class="btn ghost tog" id="labTrace" title="Show the build capture under the wireframe (T)">Trace</button>
    </div>
    <div class="lab-bar-r">
      <button class="btn ghost" id="labZoomOut" title="Zoom out (−)">−</button>
      <button class="btn ghost zoomv" id="labZoomFit" title="Fit (⌘0)">Fit</button>
      <button class="btn ghost" id="labZoomIn" title="Zoom in (+)">+</button>
      <span class="sep"></span>
      <button class="btn ghost" id="labMore" title="Board, versions and export">Board ▾</button>
      <button class="btn primary" id="labGen" title="Generate proposals from this screen">✦ Generate</button>
    </div>
  </div>
  <div class="lab-body">
    <aside class="lab-left" id="labLeft"></aside>
    <section class="lab-canvas">
      <div class="lab-banner" id="labBanner" hidden></div>
      <div class="stage-wrap" id="stageWrap">
        <div class="stage" id="stage">
          <div class="art" id="art"></div>
          <div class="hits" id="hits"></div>
          <svg class="guides" id="guides"></svg>
          <div class="selbox" id="selbox" hidden></div>
          <div class="marquee" id="marquee" hidden></div>
          <div class="hud" id="hud" hidden></div>
        </div>
      </div>
      <div class="play-bar" id="playBar" hidden>
        <button class="btn ghost" id="playBack">‹ Back</button>

        <button class="btn ghost" id="playHome">Restart</button>
      </div>
    </section>
    <aside class="lab-right" id="labRight"></aside>
  </div>`;
  $("#labUndo").onclick = undo; $("#labRedo").onclick = redo;
  $("#railTog").onclick = () => { document.body.classList.toggle("rail-open"); document.body.classList.remove("insp-open"); };
  $("#inspTog").onclick = () => { document.body.classList.toggle("insp-open"); document.body.classList.remove("rail-open"); };
  $$("#v-lab .mode").forEach(b => b.onclick = () => setMode(b.dataset.mode));
  $("#labSnap").onclick = () => { L.snap = !L.snap; $("#labSnap").classList.toggle("on", L.snap); toast(L.snap ? "Snapping on" : "Snapping off — free placement"); };
  $("#labTrace").onclick = () => { L.trace = !L.trace; $("#labTrace").classList.toggle("on", L.trace); toggleTrace(); };
  $("#labZoomIn").onclick = () => setZoom((L.z || 1) * 1.2);
  $("#labZoomOut").onclick = () => setZoom((L.z || 1) / 1.2);
  $("#labZoomFit").onclick = () => setZoom(null);
  $("#labMore").onclick = e => boardMenu(e.currentTarget);
  $("#labGen").onclick = () => App.go("studio");
  $("#playBack").onclick = playBack; $("#playHome").onclick = () => { L.playStack = []; openScreen(curBoard().start, true); };
  const hits = $("#hits");
  hits.addEventListener("pointerdown", onPointerDown);
  hits.addEventListener("dblclick", onDblClick);
  hits.addEventListener("contextmenu", onContext);
  hits.addEventListener("pointermove", e => { if (!L.drag) hoverAt(e); });
  hits.addEventListener("pointerleave", () => { L.hover = null; paintHover(); });
  $("#stageWrap").addEventListener("pointerdown", e => { if (e.target.id === "stageWrap") { if (L.mode === "edit") { L.sel.clear(); L.deep = false; labRefreshSel(); } } });
  $("#stageWrap").addEventListener("wheel", e => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom((L.z || 1) * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); } }, { passive: false });
  window.addEventListener("resize", debounce(() => { if (App.view === "lab") { fitStage(); labRenderStage(); } }, 120));
  document.addEventListener("keydown", onKey);
  /* drop components from the Add panel */
  const sw = $("#stageWrap");
  sw.addEventListener("dragover", e => { if (e.dataTransfer.types.includes("text/x-aow")) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; } });
  sw.addEventListener("drop", e => {
    const raw = e.dataTransfer.getData("text/x-aow"); if (!raw) return;
    e.preventDefault();
    const p = stagePt(e);
    addFromCatalogue(JSON.parse(raw), p.x, p.y);
  });
}

function labShow() {
  fitStage(); labRenderAll();
}
function labRenderAll() {
  if (!cur()) return;
  labRenderStage(); renderLeft(); renderRight(); renderBanner();
  $("#labUndo").disabled = !Store.undoStack.length; $("#labRedo").disabled = !Store.redoStack.length;
}
function labRefreshSel() { renderSelBox(); renderRight(); if (L.leftTab === "layers") renderLeft(); }

/* ---------------- stage ---------------- */
function fitStage() {
  const wrap = $("#stageWrap"); if (!wrap) return;
  const r = wrap.getBoundingClientRect();
  const fitZ = Math.max(0.3, Math.min((r.height - 40) / PH, (r.width - 40) / PW, 1.6));
  L.z = L.zoom || fitZ;
  $("#labZoomFit").textContent = L.zoom ? Math.round(L.z * 100) + "%" : "Fit";
}
function setZoom(z) {
  L.zoom = z ? clamp(z, 0.3, 3) : null;
  fitStage(); labRenderStage();
}
function toggleTrace() { labRenderStage(); }
function labRenderStage() {
  const s = cur(); if (!s) return;
  const z = L.z, st = $("#stage");
  st.style.width = PW * z + "px"; st.style.height = PH * z + "px";
  st.classList.toggle("play", L.mode === "play");
  const showTrace = L.trace && s.underlay;
  const traceS = showTrace && (s.underlayOpacity || 0) < 0.05 ? Object.assign({}, s, { underlayOpacity: 0.4 }) : s;
  $("#art").innerHTML = screenSVG(showTrace ? traceS : Object.assign({}, s, { underlay: null }), {
    board: curBoard(), annot: L.mode === "explain", play: L.mode === "play", width: PW * z, height: PH * z,
  });
  renderHits(); renderSelBox(); paintHover();
  $("#playBar").hidden = L.mode !== "play";
  if (L.mode === "play") renderPlayPath();
}
function renderHits() {
  const s = cur(), z = L.z, host = $("#hits");
  host.innerHTML = "";
  const list = s.blocks.slice().sort((a, b) => (a.z || 0) - (b.z || 0));
  for (const b of list) {
    if (b.hidden) continue;
    if (L.mode === "play" && b.t === "note") continue;
    const d = document.createElement("div");
    d.className = "hit" + (b.locked ? " locked" : "") + (L.mode === "play" && (b.link || (b.t === "seg" && b.links)) ? " tappable" : "");
    d.dataset.id = b.id;
    d.style.cssText = `left:${b.x * z}px;top:${b.y * z}px;width:${b.w * z}px;height:${b.h * z}px`;
    if (L.mode === "play" && !(b.link || (b.t === "seg" && b.links))) d.style.pointerEvents = "none";
    host.append(d);
  }
}
function selBBox(blocks) {
  if (!blocks.length) return null;
  const x0 = Math.min(...blocks.map(b => b.x)), y0 = Math.min(...blocks.map(b => b.y));
  const x1 = Math.max(...blocks.map(b => b.x + b.w)), y1 = Math.max(...blocks.map(b => b.y + b.h));
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
function renderSelBox() {
  const box = $("#selbox"), z = L.z, bl = selBlocks();
  if (L.mode !== "edit" || !bl.length) { box.hidden = true; return; }
  const bb = selBBox(bl);
  box.hidden = false;
  box.style.cssText = `left:${bb.x * z}px;top:${bb.y * z}px;width:${bb.w * z}px;height:${bb.h * z}px`;
  const single = bl.length === 1 && !bl[0].locked;
  box.className = "selbox" + (bl.length > 1 ? " multi" : "") + (bl.some(b => b.locked) ? " locked" : "");
  box.innerHTML = (single ? ["nw", "n", "ne", "e", "se", "s", "sw", "w"].map(h => `<i class="hd ${h}" data-h="${h}"></i>`).join("") : "") +
    `<span class="sel-tag">${esc(bl.length > 1 ? bl.length + " selected" : labelOf(bl[0]))}</span>`;
  box.querySelectorAll(".hd").forEach(el => el.addEventListener("pointerdown", onHandleDown));
  /* members of the same group get a light outline */
  $$(".hit.grp").forEach(el => el.classList.remove("grp"));
  bl.forEach(b => { const el = $(`.hit[data-id="${CSS.escape(b.id)}"]`); if (el) el.classList.add("grp"); });
}
function hoverAt(e) {
  const t = e.target.closest(".hit");
  const id = t ? t.dataset.id : null;
  if (id !== L.hover) { L.hover = id; paintHover(); }
}
function paintHover() {
  $$(".hit.hov").forEach(el => el.classList.remove("hov"));
  if (L.hover && !L.sel.has(L.hover)) { const el = $(`.hit[data-id="${CSS.escape(L.hover)}"]`); if (el) el.classList.add("hov"); }
  Bus.emit("hover", L.hover);
}
function stagePt(e) {
  const r = $("#stage").getBoundingClientRect();
  return { x: (e.clientX - r.left) / L.z, y: (e.clientY - r.top) / L.z };
}

/* ---------------- selection ---------------- */
function groupOf(b) { const s = cur(); return b.g && !L.deep ? s.blocks.filter(x => x.g === b.g) : [b]; }
function select(ids, add) {
  if (!add) L.sel.clear();
  ids.forEach(id => L.sel.add(id));
  labRefreshSel();
}
function selectBlock(b, e) {
  const members = groupOf(b).map(x => x.id);
  if (e && e.shiftKey) {
    const allIn = members.every(id => L.sel.has(id));
    members.forEach(id => allIn ? L.sel.delete(id) : L.sel.add(id));
    labRefreshSel();
  } else if (!L.sel.has(b.id)) select(members);
}

/* ---------------- pointer: move / marquee ---------------- */
function onPointerDown(e) {
  if (e.button === 2) return;
  const t = e.target.closest(".hit");
  const p = stagePt(e);
  if (L.mode === "play") { if (t) playTap(blockById(t.dataset.id), p); else flashHotspots(); return; }
  if (L.mode === "explain") { if (t) { const b = blockById(t.dataset.id); L.sel.clear(); L.sel.add(b.id); Bus.emit("explainPick", b.id); renderRight(); } return; }
  if (!canWrite(App.bid)) { if (t) { select([t.dataset.id]); } return; }
  if (!t) return startMarquee(e, p);
  const b = blockById(t.dataset.id); if (!b) return;
  if (e.metaKey || e.ctrlKey) { L.deep = true; select([b.id], e.shiftKey); }
  else selectBlock(b, e);
  if (!L.sel.has(b.id) || b.locked) return;
  const tok = beginScreen(App.bid, App.sid);
  L.drag = { kind: "move", start: p, tok, moved: false, alt: e.altKey,
    orig: selBlocks().filter(x => !x.locked).map(x => ({ id: x.id, x: x.x, y: x.y })) };
  try { $("#hits").setPointerCapture(e.pointerId); } catch (_) {}
  const mv = ev => dragMove(ev), up = ev => { dragEnd(ev); $("#hits").removeEventListener("pointermove", mv); $("#hits").removeEventListener("pointerup", up); $("#hits").removeEventListener("pointercancel", up); };
  $("#hits").addEventListener("pointermove", mv); $("#hits").addEventListener("pointerup", up); $("#hits").addEventListener("pointercancel", up);
}
let _raf = 0;
function dragMove(e) {
  const d = L.drag; if (!d) return;
  const p = stagePt(e);
  let dx = p.x - d.start.x, dy = p.y - d.start.y;
  if (!d.moved && Math.hypot(dx, dy) * L.z < 3) return;
  if (!d.moved) {
    d.moved = true;
    if (d.alt) {   /* alt-drag leaves a copy behind */
      const s = cur(), copies = [];
      d.orig.forEach(o => { const b = blockById(o.id); const c = clone(b); c.id = uid("b"); s.blocks.push(c); copies.push(c); });
      d.orig = copies.map(c => ({ id: c.id, x: c.x, y: c.y }));
      L.sel = new Set(copies.map(c => c.id));
    }
  }
  if (e.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) dy = 0; else dx = 0; }
  const moving = d.orig.map(o => ({ id: o.id, x: o.x + dx, y: o.y + dy, w: blockById(o.id).w, h: blockById(o.id).h }));
  const bb = selBBox(moving);
  const g = L.snap && !e.metaKey ? snapRect(bb, new Set(d.orig.map(o => o.id)), ["x0", "xc", "x1"], ["y0", "yc", "y1"]) : { dx: 0, dy: 0, lines: [] };
  dx += g.dx; dy += g.dy;
  if (L.snap && !e.metaKey && !g.hitX) dx = round(d.orig[0].x + dx, L.grid) - d.orig[0].x;
  if (L.snap && !e.metaKey && !g.hitY) dy = round(d.orig[0].y + dy, L.grid) - d.orig[0].y;
  d.orig.forEach(o => { const b = blockById(o.id); b.x = Math.round(o.x + dx); b.y = Math.round(o.y + dy); });
  const nb = selBBox(selBlocks());
  showHud(`${Math.round(nb.x)}, ${Math.round(nb.y)}`, nb);
  drawGuides(g.lines);
  cancelAnimationFrame(_raf); _raf = requestAnimationFrame(() => { labRenderStageFast(); });
}
function dragEnd() {
  const d = L.drag; L.drag = null;
  hideHud(); drawGuides([]);
  if (!d) return;
  if (d.moved) { commitScreen(App.bid, App.sid, d.kind === "move" ? "Move" : "Resize", d.tok.before); labRenderAll(); }
}
/* cheaper redraw while dragging: art + hits + selection only */
function labRenderStageFast() {
  const s = cur(); if (!s) return;
  $("#art").innerHTML = screenSVG(L.trace && s.underlay ? s : Object.assign({}, s, { underlay: null }), { board: curBoard(), width: PW * L.z, height: PH * L.z });
  renderHits(); renderSelBox();
}

/* ---------------- resize ---------------- */
function onHandleDown(e) {
  e.stopPropagation(); e.preventDefault();
  const b = selBlocks()[0]; if (!b) return;
  const tok = beginScreen(App.bid, App.sid);
  L.drag = { kind: "resize", h: e.target.dataset.h, start: stagePt(e), tok, moved: false, o: { x: b.x, y: b.y, w: b.w, h: b.h }, id: b.id };
  const mv = ev => resizeMove(ev), up = ev => { dragEnd(ev); window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); };
  window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up);
}
function resizeMove(e) {
  const d = L.drag; if (!d || d.kind !== "resize") return;
  const p = stagePt(e), o = d.o, b = blockById(d.id);
  const dx = p.x - d.start.x, dy = p.y - d.start.y;
  if (!d.moved && Math.hypot(dx, dy) * L.z < 2) return;
  d.moved = true;
  let x0 = o.x, y0 = o.y, x1 = o.x + o.w, y1 = o.y + o.h;
  const H = d.h;
  if (H.includes("w")) x0 = o.x + dx; if (H.includes("e")) x1 = o.x + o.w + dx;
  if (H.includes("n")) y0 = o.y + dy; if (H.includes("s")) y1 = o.y + o.h + dy;
  if (e.altKey) {   /* from the centre */
    if (H.includes("w")) x1 = o.x + o.w - dx; if (H.includes("e")) x0 = o.x - dx;
    if (H.includes("n")) y1 = o.y + o.h - dy; if (H.includes("s")) y0 = o.y - dy;
  }
  let lines = [];
  if (L.snap && !e.metaKey) {
    const others = new Set([b.id]);
    const sx = H.includes("w") ? snapValue(x0, "x", others) : H.includes("e") ? snapValue(x1, "x", others) : null;
    const sy = H.includes("n") ? snapValue(y0, "y", others) : H.includes("s") ? snapValue(y1, "y", others) : null;
    if (sx) { if (H.includes("w")) x0 = sx.v; else x1 = sx.v; lines.push(sx.line); }
    else { if (H.includes("w")) x0 = round(x0, L.grid); if (H.includes("e")) x1 = round(x1, L.grid); }
    if (sy) { if (H.includes("n")) y0 = sy.v; else y1 = sy.v; lines.push(sy.line); }
    else { if (H.includes("n")) y0 = round(y0, L.grid); if (H.includes("s")) y1 = round(y1, L.grid); }
  }
  if (e.shiftKey && o.w && o.h) {   /* keep the aspect ratio */
    const ar = o.w / o.h, nw = x1 - x0, nh = y1 - y0;
    if (H.length === 2 || H === "e" || H === "w") { const hh = nw / ar; if (H.includes("n")) y0 = y1 - hh; else y1 = y0 + hh; }
    else { const ww = nh * ar; if (H.includes("w")) x0 = x1 - ww; else x1 = x0 + ww; }
  }
  if (x1 - x0 < 4) { if (H.includes("w")) x0 = x1 - 4; else x1 = x0 + 4; }
  if (y1 - y0 < 4) { if (H.includes("n")) y0 = y1 - 4; else y1 = y0 + 4; }
  b.x = Math.round(x0); b.y = Math.round(y0); b.w = Math.round(x1 - x0); b.h = Math.round(y1 - y0);
  showHud(`${b.w} × ${b.h}`, b); drawGuides(lines);
  cancelAnimationFrame(_raf); _raf = requestAnimationFrame(labRenderStageFast);
}

/* ---------------- smart guides ---------------- */
function guideTargets(exclude) {
  const xs = [{ v: 0 }, { v: PW / 2, mid: true }, { v: PW }, { v: 12 }, { v: PW - 12 }];
  const ys = [{ v: 0 }, { v: PH / 2, mid: true }, { v: PH }, { v: 52 }];
  cur().blocks.forEach(b => {
    if (exclude.has(b.id) || b.hidden) return;
    xs.push({ v: b.x, b }, { v: b.x + b.w / 2, b, mid: true }, { v: b.x + b.w, b });
    ys.push({ v: b.y, b }, { v: b.y + b.h / 2, b, mid: true }, { v: b.y + b.h, b });
  });
  return { xs, ys };
}
function snapRect(bb, exclude) {
  const { xs, ys } = guideTargets(exclude), thr = 6 / L.z;
  const px = [bb.x, bb.x + bb.w / 2, bb.x + bb.w], py = [bb.y, bb.y + bb.h / 2, bb.y + bb.h];
  let best = { d: thr + 1 }, bestY = { d: thr + 1 };
  px.forEach(v => xs.forEach(t => { const d = Math.abs(t.v - v); if (d < best.d) best = { d, off: t.v - v, t }; }));
  py.forEach(v => ys.forEach(t => { const d = Math.abs(t.v - v); if (d < bestY.d) bestY = { d, off: t.v - v, t }; }));
  const lines = [];
  const out = { dx: 0, dy: 0, lines, hitX: false, hitY: false };
  if (best.d <= thr) { out.dx = best.off; out.hitX = true; lines.push({ x: best.t.v, y0: Math.min(bb.y, best.t.b ? best.t.b.y : 0), y1: Math.max(bb.y + bb.h, best.t.b ? best.t.b.y + best.t.b.h : PH) }); }
  if (bestY.d <= thr) { out.dy = bestY.off; out.hitY = true; lines.push({ y: bestY.t.v, x0: Math.min(bb.x, bestY.t.b ? bestY.t.b.x : 0), x1: Math.max(bb.x + bb.w, bestY.t.b ? bestY.t.b.x + bestY.t.b.w : PW) }); }
  return out;
}
function snapValue(v, axis, exclude) {
  const { xs, ys } = guideTargets(exclude), thr = 6 / L.z;
  let best = null;
  (axis === "x" ? xs : ys).forEach(t => { const d = Math.abs(t.v - v); if (d <= thr && (!best || d < best.d)) best = { d, v: t.v, t }; });
  if (!best) return null;
  return { v: best.v, line: axis === "x" ? { x: best.v, y0: 0, y1: PH } : { y: best.v, x0: 0, x1: PW } };
}
function drawGuides(lines) {
  const z = L.z, g = $("#guides");
  g.setAttribute("width", PW * z); g.setAttribute("height", PH * z);
  g.innerHTML = lines.map(l => l.x != null
    ? `<line x1="${l.x * z}" x2="${l.x * z}" y1="${l.y0 * z}" y2="${l.y1 * z}"/>`
    : `<line y1="${l.y * z}" y2="${l.y * z}" x1="${l.x0 * z}" x2="${l.x1 * z}"/>`).join("");
}
function showHud(text, r) {
  const h = $("#hud"); h.hidden = false; h.textContent = text;
  h.style.left = (r.x + r.w / 2) * L.z + "px"; h.style.top = (r.y + r.h) * L.z + 8 + "px";
}
function hideHud() { $("#hud").hidden = true; }

/* ---------------- marquee ---------------- */
function startMarquee(e, p0) {
  const add = e.shiftKey, base = new Set(add ? L.sel : []);
  if (!add) { L.sel.clear(); L.deep = false; labRefreshSel(); }
  const m = $("#marquee");
  const mv = ev => {
    const p = stagePt(ev);
    const r = { x: Math.min(p.x, p0.x), y: Math.min(p.y, p0.y), w: Math.abs(p.x - p0.x), h: Math.abs(p.y - p0.y) };
    if (r.w * L.z < 3 && r.h * L.z < 3) return;
    m.hidden = false;
    m.style.cssText = `left:${r.x * L.z}px;top:${r.y * L.z}px;width:${r.w * L.z}px;height:${r.h * L.z}px`;
    L.sel = new Set(base);
    cur().blocks.forEach(b => { if (!b.hidden && !b.locked && b.x < r.x + r.w && b.x + b.w > r.x && b.y < r.y + r.h && b.y + b.h > r.y) L.sel.add(b.id); });
    renderSelBox();
  };
  const up = () => { m.hidden = true; window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); labRefreshSel(); };
  window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up);
}

/* ---------------- double-click: enter group / edit text ---------------- */

  }
  if (mod && k === "0") { e.preventDefault(); return setZoom(null); }

  if (!canWrite(App.bid)) return;
  if (mod && k.toLowerCase() === "a") { e.preventDefault(); select(cur().blocks.filter(b => !b.hidden && !b.locked).map(b => b.id)); return; }
  if (mod && k.toLowerCase() === "c") { opCopy(); return; }
  if (mod && k.toLowerCase() === "v") { e.preventDefault(); opPaste(); return; }
  if (mod && k.toLowerCase() === "x") { opCopy(); opDelete(); return; }
  if (mod && k.toLowerCase() === "d") { e.preventDefault(); opDuplicate(); return; }
  if (mod && k.toLowerCase() === "g") { e.preventDefault(); e.shiftKey ? opUngroup() : opGroup(); return; }
  if (!L.sel.size) return;
  const step = e.shiftKey ? 8 : 1;
  if (k === "ArrowLeft") { e.preventDefault(); opNudge(-step, 0); }

  else if (k === "ArrowUp") { e.preventDefault(); opNudge(0, -step); }
  else if (k === "ArrowDown") { e.preventDefault(); opNudge(0, step); }
  else if (k === "Backspace" || k === "Delete") { e.preventDefault(); opDelete(); }
  else if (k === "Enter") { const b = selBlocks()[0]; if (b) { e.preventDefault(); inlineEdit(b); } }

  else if (k === "[") opZ(e.shiftKey ? "back" : "down");
}

/* ---------- files ---------- */
async function saveFile(filename, data, type) {
  const dl = await claude.use("downloads").catch(() => null);
  if (dl) {
    try { const r = await dl.save({ filename, data }); if (!r || r.status === "saved") toast("Saved " + filename); return; }
    catch (e) {
      if (e && e.code === "declined") return;
      if (e && e.code === "rate_limited") return toast("Another save is waiting for your answer");
      return toast("This view can't save files (" + ((e && e.code) || "unavailable") + ")");
    }
  }
  try {   /* outside the viewer (GitHub Pages, local file) a plain link works */
    const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type: type || "application/octet-stream" }));
    const a = h("a", { href: url, download: filename }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (e) { toast("Saving files is not available here"); }
}
async function exportPNG(board, screen) {

}
/* Figma: paste (⌘V) or drop the SVG — blocks arrive as named, editable layers */

        h("div.modal-actions", null,

    const x = Math.round(clamp(b.x, -20, PW) * k), y = Math.round(clamp(b.y, -20, PH) * k);

    if (Array.isArray(v)) return v.forEach(x => walk(x, depth + 1));
    if (typeof v !== "object") return;
    const url = v.url || v.uri || v.image_url || v.download_url || v.signed_url;

function thumbDataURL(file, budget) {

    const img = new Image(), url = URL.createObjectURL(file);

        out = c.toDataURL("image/jpeg", q);
        if (out.length <= budget) break;
        w = Math.round(w * 0.82); q = Math.max(0.5, q - 0.07);
      }

async function attachRenderImage(r, i, file) {
  r.outputs = r.outputs || [];
  const o = r.outputs[i] || (r.outputs[i] = {});
  try {
    const t = await thumbDataURL(file, Math.floor(170000 / Math.max(1, r.outputs.length)));
    o.thumb = t.data; o.width = o.width || t.w; o.height = o.height || t.h;
    if (ST.caps.assets) { try { const up = await ST.caps.assets.upload(await downscale(file, 1600)); o.asset = up.id; } catch (e) { console.warn("asset upload", e); } }
    ST.armed = null;
    await saveRender(r);
    refreshGallery();
    toast(Store.cloud ? "In the gallery — everyone with the link sees it" : "In the gallery (this browser)");
  } catch (e) { toast(e.message || "Couldn't read that image"); }
}
/* ⌘V in the Studio: an image goes to the tile waiting for it, else to the references */

  if (r) return attachRenderImage(r, ST.armed.i, f);

});
async function uploadAssetImage() {
  if (!ST.caps.assets) return null;
  return new Promise(res => {
    const inp = h("input", { type: "file", accept: "image/png,image/jpeg,image/webp" });

      const f = inp.files[0]; if (!f) return res(null);

}

const VIEWS = [

  openBoard(bid, sid) {

function renderStatus(st) {

  };
  const [t, c] = view ? [Store.canShare ? "View only · make a variant to edit" : "View only · ask for “Can interact” to save", "warn"] : (map[st] || map.local);

/* re-render on data changes without stealing focus from the inspector */
const rerenderView = debounce(() => { if (App.view !== "lab") (VIEWS.find(x => x.id === App.view) || VIEWS[0]).render(); }, 160);
const rethumb = debounce(() => { if (App.view === "lab" && L.leftTab !== "add") renderLeft(); }, 450);
function wireBus() {
  Bus.on("change", e => {
    $("#labUndo") && ($("#labUndo").disabled = !Store.undoStack.length);
    $("#labRedo") && ($("#labRedo").disabled = !Store.redoStack.length);
    if (App.view === "lab") {
      if (!S(App.bid, App.sid) && B(App.bid)) App.sid = B(App.bid).start;
      if (!L.drag) labRenderStage();
      const big = e && (e.structural || /^(Undo|Redo|Restore|Apply|Import|Reset|Delete|Duplicate|Paste|Group|Ungroup|Add)/.test(e.label || ""));
      if (big) { renderLeft(); renderRight(); renderBanner(); } else rethumb();
    } else rerenderView();
    App.renderBar();
  });
  Bus.on("remote", () => {
    if (L.drag) return;
    if (!B(App.bid)) App.bid = "proposal";
    if (!S(App.bid, App.sid)) App.sid = B(App.bid).start;
    if (App.view === "lab") {
      labRenderStage(); rethumb();
      if (!$("#labRight").contains(document.activeElement)) renderRight();
    } else rerenderView();
    App.renderBar();
  });
  Bus.on("status", renderStatus);
  Bus.on("compareFocus", sid => setTimeout(() => compareRender(sid), 0));
}
