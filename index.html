<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1316">
</head>
<body>
<title>Metagame Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a command bar over full-height views — briefing pages (Story, Compare, Flow) and a three-pane console (Lab, Studio). The phone art stays dark: it is the game. */
:root {
  --ground: #EEF2F1;      /* cool paper */
  --panel: #FFFFFF;
  --panel-2: #F5F8F7;
  --line: #D3DDDC;
  --line-2: #BFCDCC;
  --ink: #10191C;
  --ink-2: #33464B;
  --muted: #5E7276;
  --accent: #B8680A;      /* signal amber — Start Battle's colour, darkened for paper */
  --accent-ink: #FFFFFF;
  --accent-soft: #F7E2C2;
  --cool: #1B7890;
  --good: #1E8F4E;
  --bad: #C2372C;
  --warn: #9A6A00;
  --shadow: 0 1px 2px rgba(16,25,28,.06), 0 8px 24px rgba(16,25,28,.07);
  --phone-bg: #0B1519;
  --f-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --bar-h: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0B1316; --panel: #111C20; --panel-2: #152227; --line: #22353B; --line-2: #2E474E;
    --ink: #E5EEEE; --ink-2: #BFD0D1; --muted: #87A0A3; --accent: #F3A73B; --accent-ink: #1C1204; --accent-soft: #3A2A12;
    --cool: #5CC6DF; --good: #4CC47A; --bad: #F06A5E; --warn: #E3B24F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0B1316; --panel: #111C20; --panel-2: #152227; --line: #22353B; --line-2: #2E474E;
  --ink: #E5EEEE; --ink-2: #BFD0D1; --muted: #87A0A3; --accent: #F3A73B; --accent-ink: #1C1204; --accent-soft: #3A2A12;
  --cool: #5CC6DF; --good: #4CC47A; --bad: #F06A5E; --warn: #E3B24F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); color-scheme: dark;
}

html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.center { text-align: center; }
.good { color: var(--good); }
.warn { color: var(--warn); font-size: 12.5px; }
kbd { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

/* ---------------- command bar ---------------- */
#bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--bar-h);
  display: flex; align-items: center; gap: 14px; padding: 0 16px;
  background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; flex-direction: column; line-height: 1; white-space: nowrap; flex: none; }
.brand b { font: 700 19px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.brand small { font: 500 10px/1.2 var(--f-mono); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; margin-top: 3px; }
#nav { display: flex; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 0 1 auto; }
#nav button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; font: 600 15px/1 var(--f-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
#nav button:hover { color: var(--ink); }
#nav button.on { background: var(--ink); color: var(--panel); }
.bar-r { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; flex: none; }
#boardChip { font: 600 12px/1 var(--f-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.save-chip { font: 500 11.5px/1 var(--f-mono); padding: 6px 9px; border-radius: 99px; border: 1px solid var(--line); white-space: nowrap; color: var(--muted); }
.save-chip.ok::before, .save-chip.local::before, .save-chip.busy::before, .save-chip.bad::before, .save-chip.warn::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; background: var(--good); }
.save-chip.local::before { background: var(--cool); }
.save-chip.busy::before { background: var(--accent); animation: pulse 1s infinite; }
.save-chip.bad::before { background: var(--bad); }
.save-chip.warn::before { background: var(--warn); }
@keyframes pulse { 50% { opacity: .3; } }
.icon-round { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-weight: 700; color: var(--muted); }

/* ---------------- buttons, chips, forms ---------------- */
.btn { border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 7px 12px; font-weight: 500; font-size: 13px; line-height: 1.1; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ink-2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--panel-2); border-color: var(--line); }
.btn.ghost.tog.on { background: var(--accent-soft); color: var(--ink); border-color: transparent; }
.btn.small { padding: 5px 9px; font-size: 12px; border-radius: 7px; }
.btn.tiny { padding: 2px 7px; font-size: 11px; border-radius: 6px; margin-left: 8px; }
.btn.on { background: var(--ink); color: var(--panel); }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.btn-row.end { justify-content: flex-end; margin-top: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--panel-2); border-radius: 99px; padding: 3px 9px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); }
.chip.tog.on { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.chip.bad { border-color: var(--bad); color: var(--bad); }
.chip-x { border: 0; background: none; color: var(--muted); padding: 0 2px; font-size: 14px; line-height: 1; }
input[type="text"], input[type="number"], select, textarea {
  width: 100%; box-sizing: border-box; border: 1px solid var(--line-2); background: var(--panel); border-radius: 7px; padding: 6px 8px; font-size: 13px; min-width: 0;
}
textarea { resize: vertical; line-height: 1.4; }
input:disabled, select:disabled, textarea:disabled { opacity: .6; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="checkbox"] { accent-color: var(--accent); }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }

/* ---------------- views ---------------- */
main { min-height: calc(100% - var(--bar-h)); }
.view { min-height: calc(100vh - var(--bar-h)); }
body[data-view="lab"] { overflow: hidden; }
body[data-view="lab"] main, body[data-view="lab"] #v-lab { height: calc(100% - var(--bar-h)); min-height: 0; }

/* ---------------- documents (Story, Compare, Flow) ---------------- */
.doc { max-width: 1060px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 80px; box-sizing: border-box; }
.doc.wide { max-width: 1320px; }
.doc-tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 6px 0 14px; font-size: 13px; }
.doc-tools select { width: auto; }
.doc-tools .jump { display: flex; flex-wrap: wrap; gap: 4px; }
.doc-tools .jump a { font: 500 12px/1 var(--f-mono); color: var(--muted); text-decoration: none; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; }
.doc-tools .jump a:hover { color: var(--ink); border-color: var(--ink-2); }
.hero { padding: 28px 0 22px; border-bottom: 2px solid var(--ink); margin-bottom: 26px; }
.hero.compact { padding: 8px 0 18px; margin-bottom: 20px; }
.kicker { font: 600 12px/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.hero h1 { font: 700 clamp(34px, 5.4vw, 64px)/.95 var(--f-display); text-transform: uppercase; letter-spacing: .01em; margin: 0 0 14px; text-wrap: balance; max-width: 16ch; }
.hero.compact h1 { font-size: clamp(26px, 3.6vw, 40px); max-width: none; }
.lede { font-size: 17px; line-height: 1.55; color: var(--ink-2); max-width: 64ch; margin: 0 0 12px; }
.tbd-line { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; }
.tbd-stamp { font: 700 13px/1 var(--f-display); letter-spacing: .14em; color: var(--bad); border: 2px solid var(--bad); padding: 3px 7px 2px; border-radius: 4px; transform: rotate(-4deg); display: inline-block; background: color-mix(in srgb, var(--bad) 8%, transparent); }
.tbd-stamp.small { font-size: 11px; padding: 2px 5px 1px; }
.block { margin: 34px 0; }
.block h2 { font: 700 26px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .03em; margin: 0 0 6px; text-wrap: balance; }
.block > .muted { margin: 0 0 14px; max-width: 70ch; }
.block.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 26px; }
.block.cols h2 { font-size: 21px; }
.editable { outline: 1px dashed color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 3px; border-radius: 3px; cursor: text; }
.editable:focus { outline-style: solid; background: var(--accent-soft); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 6px 0 18px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.kpi-label { font-size: 12.5px; color: var(--muted); line-height: 1.3; min-height: 2.6em; }
.kpi-nums { display: flex; align-items: baseline; gap: 8px; font: 700 34px/1 var(--f-display); font-variant-numeric: tabular-nums; margin-top: 4px; }
.kpi-a { color: var(--muted); }
.kpi-arrow { font-size: 20px; color: var(--muted); }
.kpi.up .kpi-b { color: var(--good); }
.kpi.down .kpi-b { color: var(--bad); }
.kpi-note { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
table { border-collapse: collapse; width: 100%; }
.jt td, .jt th { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13.5px; }
.jt th { font: 600 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.jt td.n, .journeys td.n { font: 700 18px/1 var(--f-display); font-variant-numeric: tabular-nums; text-align: center; width: 70px; }
.delta { font: 600 12px/1 var(--f-mono); }
.delta.good { color: var(--good); } .delta.bad { color: var(--bad); }
.howto .steps { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; max-width: 76ch; color: var(--ink-2); }
.pillars { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.pillar { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 12px; }
.pid { font: 700 13px/1 var(--f-mono); color: var(--accent); letter-spacing: .08em; }
.pillar h3, .move h3 { font: 700 21px/1.05 var(--f-display); text-transform: uppercase; margin: 6px 0 8px; letter-spacing: .02em; }
.pillar p { margin: 0 0 8px; color: var(--ink-2); font-size: 13.5px; }
.pillar .bench { color: var(--muted); font-size: 12.5px; }
.pillar .bench span:first-child { font-weight: 600; }
.pillar .ua { font-size: 12px; color: var(--good); }
.moves { display: grid; gap: 12px; }
.move { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; cursor: pointer; }
.move:hover { border-color: var(--ink-2); }
.move-phones { display: flex; align-items: center; gap: 8px; }
.move-arrow { font: 700 22px/1 var(--f-display); color: var(--accent); }
.mini svg { display: block; border-radius: 10px; box-shadow: 0 0 0 1px var(--line-2); }
.move p { margin: 0 0 6px; color: var(--ink-2); max-width: 70ch; }
.move .link { font: 600 12px/1 var(--f-mono); color: var(--accent); }
.bench-list { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 7px; color: var(--ink-2); font-size: 13.5px; }
.cov-missing { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
.cov-wrap summary { cursor: pointer; font-weight: 600; margin: 10px 0; }
.table-scroll { overflow-x: auto; }
.cov td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
.cov tr.cat td { font: 600 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); padding-top: 16px; }
.cov tr.bad td { color: var(--bad); }
.doc-foot { margin-top: 50px; padding-top: 14px; border-top: 1px solid var(--line); font: 500 11.5px/1.5 var(--f-mono); color: var(--muted); }

/* compare */
.pair { padding: 26px 0 30px; border-top: 1px solid var(--line); scroll-margin-top: calc(var(--bar-h) + 10px); }
.pair-head { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 16px; }
.pair-n { font: 700 44px/.8 var(--f-display); color: var(--accent); }
.pair-head h2 { font: 700 28px/1.05 var(--f-display); text-transform: uppercase; margin: 0 0 4px; }
.pair-head p { margin: 0; max-width: 70ch; }
.pair-phones { display: grid; grid-template-columns: 300px 300px minmax(0, 1fr); gap: 22px; align-items: start; }
.phone-card { margin: 0; }
.phone-card figcaption { display: flex; justify-content: space-between; align-items: center; font: 600 11.5px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; height: 20px; }
.phone { border-radius: 26px; overflow: hidden; background: var(--phone-bg); box-shadow: 0 0 0 1px var(--line-2), var(--shadow); line-height: 0; }
.phone svg { display: block; width: 100%; height: auto; }
.phone-card.tbd .phone { box-shadow: 0 0 0 2px color-mix(in srgb, var(--bad) 55%, transparent), var(--shadow); }
.phone-empty { height: 400px; display: grid; place-items: center; border: 1px dashed var(--line-2); border-radius: 26px; color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
.legend { margin-top: 10px; font-size: 12.5px; }
.legend summary { cursor: pointer; color: var(--muted); }
.legend ol { padding-left: 20px; margin: 8px 0 0; display: grid; gap: 4px; color: var(--ink-2); }
.legend .goes, .explain .goes { color: var(--cool); }
.pair-side h3 { font: 700 16px/1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; margin: 26px 0 10px; }
.pair-side h3:first-child { margin-top: 28px; }
.changes-list { margin: 0; padding-left: 20px; display: grid; gap: 9px; color: var(--ink-2); font-size: 13.5px; }
.tags { display: inline-flex; gap: 4px; margin-left: 6px; flex-wrap: wrap; }
.tag { font: 600 10.5px/1 var(--f-mono); padding: 3px 5px; border-radius: 4px; background: var(--accent-soft); color: var(--ink); }
.went td { padding: 5px 6px; border-bottom: 1px solid var(--line); font-size: 12.5px; vertical-align: top; }
.went td:first-child { color: var(--ink-2); width: 46%; }
.went tr.bad td { color: var(--bad); }

/* ---- endings: one screen drawn in every state (post-match) ---- */
.new-chip { display: inline-block; margin-left: 6px; font: 700 9.5px/1 var(--f-mono); letter-spacing: .06em; padding: 2px 5px; border-radius: 4px; vertical-align: 1px;
  color: var(--cool); background: color-mix(in srgb, var(--cool) 14%, transparent); border: 1px solid color-mix(in srgb, var(--cool) 45%, transparent); }
.explain .new-chip { margin: 4px 0 0; }
.endings { margin-top: 30px; padding-top: 6px; border-top: 1px dashed var(--line-2); }
.endings h3 { font: 700 16px/1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; margin: 28px 0 10px; }
.endings-head h3 { margin-top: 22px; }
.endings-head p { margin: 0 0 14px; max-width: 80ch; }
.endings-strip { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 16px 14px; }
.ending { margin: 0; cursor: pointer; min-width: 0; display: flex; flex-direction: column; }
.ending .phone { border-radius: 16px; transition: box-shadow .15s; }
.ending:hover .phone { box-shadow: 0 0 0 2px var(--ink-2), var(--shadow); }
.ending.main .phone { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.ending figcaption { margin-top: 8px; font-size: 12px; line-height: 1.35; color: var(--muted); display: flex; flex-direction: column; gap: 3px; flex: 1; }
.ending figcaption b { font: 700 15px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .03em; color: var(--ink); }
.ending .ending-edit { align-self: flex-start; margin: auto 0 0; }
.pm-matrix { min-width: 1040px; }
.pm-matrix th, .pm-matrix td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; font-size: 12.5px; line-height: 1.35; }
.pm-matrix thead th { font: 600 10.5px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pm-matrix tbody th { font-weight: 600; white-space: nowrap; color: var(--ink); position: sticky; left: 0; background: var(--ground); }
.pm-matrix td { color: var(--ink-2); }
.pm-matrix td.none { color: var(--muted); }
.pm-matrix td.new { color: var(--cool); }
.pm-bench { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1300px) { .endings-strip { grid-template-columns: repeat(4, minmax(0, 1fr)); } .pm-bench { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .pm-bench { grid-template-columns: minmax(0, 1fr); } }
.pm-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 12px; min-width: 0; }
.pm-card h4 { font: 700 19px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; margin: 0 0 10px; }
.pm-card dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 10px; margin: 0; }
.pm-card dt { font: 600 10.5px/1.6 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pm-card dd { margin: 0; font-size: 13px; color: var(--ink-2); }
.pm-card .take { font-size: 13px; margin: 12px 0 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.pm-card .take b { font: 600 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.pm-card .src { font-size: 11.5px; color: var(--muted); margin: 0; }
.pm-card .src a { color: var(--cool); }
.pm-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 0 28px; }
.pm-rules, .pm-decisions { margin: 0; padding-left: 20px; display: grid; gap: 7px; font-size: 13.5px; color: var(--ink-2); }
.pm-tips th, .pm-tips td { padding: 6px 6px; border-bottom: 1px solid var(--line); font-size: 12.5px; text-align: left; vertical-align: top; }
.pm-tips th { font: 600 10.5px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pm-tips td:first-child { font-weight: 600; color: var(--ink); }

/* flow */
.seg-ctl { display: inline-flex; flex-wrap: wrap; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
.seg-ctl button { border: 0; background: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; color: var(--muted); }
.seg-ctl button.on { background: var(--ink); color: var(--panel); }
.flow-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); margin-top: 14px; max-height: 76vh; }
.flow { display: block; }
.flow .edge { fill: none; stroke: var(--line-2); stroke-width: 1.4; }
.flow .edge.hot { stroke: var(--accent); stroke-width: 3; }
.flow .arrowhead { fill: var(--line-2); }
.flow .arrowhead.hot { fill: var(--accent); }
.flow .nf { fill: var(--panel-2); stroke: var(--line); stroke-width: 1; }
.flow .node { cursor: pointer; }
.flow .node:hover .nf { stroke: var(--ink-2); }
.flow .node.hot .nf { stroke: var(--accent); stroke-width: 2.5; fill: var(--accent-soft); }
.flow .node.start .nf { stroke: var(--cool); stroke-width: 2; }
.flow .node.orphan .nf { stroke-dasharray: 5 4; }
.flow .nl { font: 600 11px var(--f-body); fill: var(--ink); }
.flow .ntag { font: 600 9px var(--f-mono); fill: var(--muted); }
.flow .col { font: 600 10.5px var(--f-mono); fill: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

/* ---------------- LAB ---------------- */
#v-lab { display: flex; flex-direction: column; }
.lab-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; overflow-x: auto; }
.lab-bar-l, .lab-bar-r { display: flex; align-items: center; gap: 4px; }
.modes { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.mode { border: 0; background: none; padding: 5px 11px; border-radius: 6px; font: 600 13px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mode.on { background: var(--ink); color: var(--panel); }
.zoomv { min-width: 52px; justify-content: center; font-family: var(--f-mono); font-size: 12px; }
.lab-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr) 320px; }
.lab-left, .lab-right { background: var(--panel); overflow-y: auto; min-height: 0; }
.lab-left { border-right: 1px solid var(--line); }
.lab-right { border-left: 1px solid var(--line); }
.lab-canvas { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background:
  radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--ink) 9%, transparent) 1px, transparent 0) 0 0 / 18px 18px, var(--ground); }
.lab-banner { margin: 10px 12px 0; padding: 8px 12px; border-radius: 9px; background: var(--accent-soft); color: var(--ink); font-size: 12.5px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stage-wrap { flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 20px; }
.stage { position: relative; flex: none; border-radius: 30px; overflow: visible; box-shadow: 0 0 0 1px var(--line-2), 0 20px 50px rgba(0,0,0,.18); margin: auto; }
.stage .art { position: absolute; inset: 0; border-radius: 30px; overflow: hidden; line-height: 0; }
.stage .art svg { display: block; }
.hits { position: absolute; inset: 0; }
.hit { position: absolute; border-radius: 3px; }
.hit.hov { box-shadow: 0 0 0 1.5px var(--cool); }
.hit.grp { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 70%, transparent); }
.hit.locked { cursor: not-allowed; }
.stage.play .hit.tappable { cursor: pointer; }
.hits.flash .hit.tappable { animation: flash .7s ease-out; }
@keyframes flash { 0%, 60% { background: color-mix(in srgb, var(--cool) 35%, transparent); box-shadow: 0 0 0 2px var(--cool); } 100% { background: transparent; } }
.stage.flip .art { animation: flip .22s ease-out; }
@keyframes flip { from { opacity: .35; transform: translateX(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .stage.flip .art, .hits.flash .hit.tappable { animation: none; } }
.guides { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.guides line { stroke: #FF4FA3; stroke-width: 1; }
.selbox { position: absolute; border: 1.5px solid var(--accent); pointer-events: none; border-radius: 2px; }
.selbox.multi { border-style: dashed; }
.selbox.locked { border-color: var(--muted); }
.selbox .hd { position: absolute; width: 9px; height: 9px; background: #fff; border: 1.5px solid var(--accent); border-radius: 2px; pointer-events: auto; }
.hd.nw { left: -5px; top: -5px; cursor: nwse-resize; } .hd.n { left: calc(50% - 5px); top: -5px; cursor: ns-resize; } .hd.ne { right: -5px; top: -5px; cursor: nesw-resize; }
.hd.e { right: -5px; top: calc(50% - 5px); cursor: ew-resize; } .hd.se { right: -5px; bottom: -5px; cursor: nwse-resize; } .hd.s { left: calc(50% - 5px); bottom: -5px; cursor: ns-resize; }
.hd.sw { left: -5px; bottom: -5px; cursor: nesw-resize; } .hd.w { left: -5px; top: calc(50% - 5px); cursor: ew-resize; }
.sel-tag { position: absolute; left: -1px; top: -22px; background: var(--accent); color: var(--accent-ink); font: 600 10.5px/1 var(--f-mono); padding: 4px 6px; border-radius: 4px; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.marquee { position: absolute; border: 1px solid var(--cool); background: color-mix(in srgb, var(--cool) 12%, transparent); pointer-events: none; }
.hud { position: absolute; transform: translateX(-50%); background: var(--ink); color: var(--panel); font: 600 11px/1 var(--f-mono); padding: 4px 7px; border-radius: 5px; pointer-events: none; white-space: nowrap; }
.inline-edit { position: absolute; z-index: 5; border: 2px solid var(--accent); border-radius: 4px; background: #0B1519; color: #fff; font: 600 14px/1.25 var(--f-display); padding: 4px 6px; resize: none; box-sizing: border-box; }
.play-bar { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--panel); font: 500 12px/1.3 var(--f-mono); color: var(--muted); flex: none; }

/* left rail */
.rail-tabs { display: flex; position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 2; }
.rail-tab { flex: 1; border: 0; background: none; padding: 10px 0 9px; font: 600 13px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; }
.rail-tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.pane { padding: 10px; }
.pane-title { font: 600 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 14px 2px 8px; }
.pane-hint { font-size: 11.5px; color: var(--muted); margin: 0 2px 8px; }
.pane-actions { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
.screen-list { display: grid; gap: 4px; }
.screen-card { display: flex; gap: 9px; align-items: center; padding: 5px; border-radius: 9px; border: 1px solid transparent; cursor: pointer; }
.screen-card:hover { background: var(--panel-2); }
.screen-card.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.screen-card.orphan .screen-sub { color: var(--warn); }
.screen-card.drop { border-color: var(--cool); border-style: dashed; }
.screen-card.dragging { opacity: .4; }
.thumb { flex: none; width: 54px; height: 117px; border-radius: 8px; overflow: hidden; background: var(--phone-bg); line-height: 0; box-shadow: 0 0 0 1px var(--line); }
.screen-meta { min-width: 0; }
.screen-name { font-weight: 600; font-size: 13px; line-height: 1.25; }
.screen-sub { font-size: 11px; color: var(--muted); }
.layer-list { display: grid; gap: 1px; }
.layer { display: grid; grid-template-columns: 70px 1fr auto auto auto; gap: 6px; align-items: center; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.layer:hover { background: var(--panel-2); }
.layer.on { background: var(--accent-soft); }
.layer.hid { opacity: .5; }
.layer-type { font: 500 10px/1 var(--f-mono); color: var(--muted); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-link { color: var(--cool); font-weight: 700; }
.icon-btn { border: 0; background: none; padding: 2px 4px; color: var(--muted); font-size: 11px; border-radius: 4px; }
.icon-btn:hover { background: var(--line); color: var(--ink); }
.add-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.add-item { border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px; padding: 6px; text-align: left; cursor: grab; display: grid; gap: 4px; }
.add-item:hover { border-color: var(--ink-2); }
.add-thumb { height: 46px; background: var(--phone-bg); border-radius: 6px; padding: 4px; box-sizing: border-box; line-height: 0; }
.add-label { font-size: 11.5px; font-weight: 600; line-height: 1.2; }

/* inspector */
.insp { padding: 12px 14px 30px; }
.insp-head { padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.insp-kicker { font: 600 10.5px/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
.insp-title { font: 700 20px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; margin-top: 3px; word-break: break-word; }
.insp-sec { padding: 10px 0; border-bottom: 1px solid var(--line); }
.insp-sec h4 { font: 600 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 2px 0 9px; }
.insp-row { display: grid; gap: 4px; margin-bottom: 9px; }
.insp-label { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.insp-hint { font-size: 11.5px; color: var(--muted); margin: 0; }
.insp-hint.tip { margin-top: 16px; }
.insp-inline { display: flex; gap: 14px; font-size: 12.5px; margin-top: 4px; }
.insp-inline label { display: flex; gap: 5px; align-items: center; }
.purpose { color: var(--ink-2); font-size: 13px; margin: 8px 0; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line-2); }
.swatch.on { box-shadow: 0 0 0 2px var(--ink); }
.icon-picks { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
.pick { border: 1px solid var(--line); background: var(--panel-2); border-radius: 5px; width: 26px; height: 26px; padding: 0; font-size: 13px; }
.xywh { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.xywh label { display: grid; gap: 2px; font: 600 10px/1 var(--f-mono); color: var(--muted); }
.feat-add { margin-top: 4px; }
.seg-links .insp-row { grid-template-columns: 80px 1fr; align-items: center; }
.changes { display: grid; gap: 8px; margin-bottom: 8px; }
.change { display: grid; grid-template-columns: 20px 1fr auto; gap: 6px; align-items: start; }
.change-n { font: 700 14px/26px var(--f-display); color: var(--accent); }
.change-body { display: grid; gap: 5px; }
.change .chip { font-size: 10.5px; padding: 2px 6px; }
.explain { list-style: none; margin: 10px 0; padding: 0; display: grid; gap: 2px; }
.explain li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 7px 6px; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
.explain li:hover, .explain li.on { background: var(--accent-soft); }
.explain .num { width: 20px; height: 20px; border-radius: 50%; background: #FFB547; color: #1B1203; font: 700 11px/20px var(--f-body); text-align: center; }
.explain b { font-size: 13px; }
.explain .does { color: var(--ink-2); }
.explain .feat { color: var(--muted); font-size: 11px; font-family: var(--f-mono); }
.journeys td { padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.keys td { padding: 4px 8px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.keys td:first-child { font-family: var(--f-mono); font-size: 11.5px; white-space: nowrap; }
.version-list { display: grid; gap: 8px; max-height: 60vh; overflow: auto; }
.version { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }

/* context menu, modals, toast */
.ctx { position: fixed; z-index: 60; background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; padding: 5px; box-shadow: var(--shadow); min-width: 220px; max-height: 80vh; overflow-y: auto; }
.ctx-item { display: flex; justify-content: space-between; gap: 18px; width: 100%; border: 0; background: none; padding: 7px 10px; border-radius: 6px; font-size: 13px; text-align: left; white-space: pre; }
.ctx-item:hover:not(:disabled) { background: var(--panel-2); }
.ctx-item:disabled { opacity: .4; }
.ctx-sep { height: 1px; background: var(--line); margin: 4px 6px; }
.modal { position: fixed; inset: 0; z-index: 80; background: rgba(6, 12, 14, .55); display: grid; place-items: center; padding: 16px; }
.modal-card { background: var(--panel); border-radius: 14px; padding: 20px 22px; width: min(460px, 100%); box-shadow: var(--shadow); max-height: 86vh; overflow: auto; box-sizing: border-box; }
.modal-card.wide { width: min(640px, 100%); }
.modal-card h3 { font: 700 22px/1.1 var(--f-display); text-transform: uppercase; margin: 0 0 10px; }
.modal-card p { color: var(--ink-2); margin: 0 0 10px; }
.modal-card textarea, .modal-card input { margin: 6px 0 4px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
#toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); z-index: 90; background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 9px; font-size: 13px; opacity: 0; pointer-events: none; transition: .2s; max-width: calc(100% - 32px); }
#toast.on { opacity: 1; transform: translateX(-50%); }

/* ---------------- STUDIO ---------------- */
.studio { display: grid; grid-template-columns: 260px minmax(0, 1fr) 340px; gap: 0; min-height: calc(100vh - var(--bar-h)); }
.st-src, .st-gallery { background: var(--panel); padding: 16px; box-sizing: border-box; }
.st-src { border-right: 1px solid var(--line); display: grid; gap: 8px; align-content: start; }
.st-src .phone { width: 100%; max-width: 250px; margin: 6px auto; border-radius: 22px; }
.st-gallery { border-left: 1px solid var(--line); display: grid; gap: 12px; align-content: start; overflow-y: auto;
  position: sticky; top: var(--bar-h); align-self: start; height: calc(100vh - var(--bar-h)); }
.gal-head { display: flex; justify-content: space-between; align-items: end; gap: 8px; }
.gal-help { margin: 0; line-height: 1.45; }
.gal-run { display: grid; gap: 7px; padding-top: 12px; border-top: 1px solid var(--line); }
.gal-run.bad .gal-meta b { color: var(--warn); }
.gal-meta { display: grid; gap: 2px; font-size: 12.5px; }
.gal-meta span { font: 500 11px/1.3 var(--f-mono); color: var(--muted); }
.gal-grid { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.gal-grid.n1 { grid-template-columns: minmax(0, 1fr); max-width: 62%; }
.gal-grid.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.gal-tile { position: relative; margin: 0; border-radius: 10px; overflow: hidden; background: var(--phone-bg); box-shadow: 0 0 0 1px var(--line-2); cursor: pointer; max-width: 100%; }
.gal-tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
.gal-tile.has:hover { box-shadow: 0 0 0 2px var(--accent); }
.gal-tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gal-wire { position: absolute; inset: 0; opacity: .32; line-height: 0; }
.gal-wire svg { width: 100%; height: 100%; }
.gal-empty { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px; padding: 10px; text-align: center; font: 600 11.5px/1.3 var(--f-body); color: #DCE8E9; }
.gal-empty .btn.tiny { margin: 0; }
.gal-tile.armed { box-shadow: 0 0 0 2px var(--accent); }
.gal-tile.armed .gal-empty span { color: #FFD27A; }
.gal-tile.drop-on { box-shadow: 0 0 0 2px var(--cool); }
.gal-ref { position: absolute; left: 6px; bottom: 6px; border: 0; border-radius: 6px; padding: 3px 6px; font: 600 10.5px/1 var(--f-body); background: rgba(6, 12, 14, .72); color: #EAF2F2; opacity: 0; transition: opacity .15s; }
.gal-tile:hover .gal-ref, .gal-tile:focus-within .gal-ref { opacity: 1; }
.lightbox { background: rgba(4, 8, 10, .82); }
.lightbox-card { margin: 0; display: grid; gap: 10px; justify-items: center; max-width: min(92vw, 720px); }
.lightbox-card img { max-width: 100%; max-height: calc(86vh - 70px); border-radius: 14px; display: block; box-shadow: var(--shadow); }
.lightbox-card figcaption { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; width: 100%; color: #EAF2F2; font-size: 13px; }
.lightbox-card .muted { color: #A9BDBF; }
.lightbox-card .btn-row { margin: 0; }
.st-gallery h3, .st-refs h3, .st-variants h3 { font: 700 18px/1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; margin: 0; }
.st-main { padding: 20px 26px 60px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.st-main h2 { font: 700 30px/1 var(--f-display); text-transform: uppercase; margin: 0; text-wrap: balance; }
.st-opts { display: grid; gap: 8px; font-size: 13px; }
.st-refs { display: grid; gap: 8px; }
.ref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.ref { position: relative; border: 1px solid var(--line); border-radius: 10px; padding: 5px; cursor: pointer; background: var(--panel); opacity: .55; }
.ref.on { opacity: 1; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ref img, .ref-ph { width: 100%; height: 110px; object-fit: cover; border-radius: 6px; display: grid; place-items: center; background: var(--phone-bg); color: #9fb6b9; font: 600 11px var(--f-mono); }
.ref-name { font-size: 11.5px; font-weight: 600; margin-top: 4px; line-height: 1.25; }
.ref-kind { font: 500 10px/1 var(--f-mono); color: var(--muted); margin-top: 2px; }
.ref .chip-x { position: absolute; right: 4px; top: 4px; background: var(--panel); border-radius: 50%; width: 20px; height: 20px; }
.drop { border: 1.5px dashed var(--line-2); border-radius: 10px; padding: 10px; text-align: center; color: var(--muted); font-size: 12.5px; }
.drop.on { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.st-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.st-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 9px; align-content: start; }
.st-card-head { display: flex; justify-content: space-between; align-items: baseline; }
.st-card-head b { font: 700 19px/1 var(--f-display); text-transform: uppercase; }
.st-card-head .by { font: 600 10.5px/1 var(--f-mono); color: var(--accent); text-transform: uppercase; letter-spacing: .1em; }
.st-card p { margin: 0; font-size: 12.5px; }
.st-row { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; }
.st-row label { display: grid; gap: 3px; flex: 1; min-width: 90px; }
.cap-off { font-size: 12px; color: var(--warn); margin: 0; }
.st-status { font: 500 12.5px/1.4 var(--f-mono); color: var(--muted); display: flex; gap: 10px; align-items: center; min-height: 20px; }
.st-status.on::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; flex: none; }
.st-critique { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; font-size: 13.5px; color: var(--ink-2); }
.st-critique h4 { font: 700 15px/1 var(--f-display); text-transform: uppercase; letter-spacing: .05em; margin: 12px 0 6px; color: var(--ink); }
.st-critique ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.st-variants { display: grid; gap: 12px; }
.st-variant { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.st-variant .phone { border-radius: 20px; }
.st-variant h4 { font: 700 20px/1 var(--f-display); text-transform: uppercase; margin: 2px 0 8px; }
.st-variant p { margin: 0 0 8px; color: var(--ink-2); font-size: 13px; }
.st-variant ul { margin: 0 0 8px; padding-left: 18px; font-size: 12.5px; color: var(--ink-2); display: grid; gap: 3px; }
.render { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 6px; background: var(--panel-2); }
.render.bad { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.render.drop-on { border-color: var(--accent); background: var(--accent-soft); }
.render-img { width: 100%; border-radius: 8px; display: block; }
.render-meta { display: grid; gap: 2px; font-size: 12.5px; }
.render-meta .muted { font: 500 11px var(--f-mono); }
.render-brief { font-size: 12px; color: var(--ink-2); margin: 0; font-style: italic; }
.render-links { display: flex; flex-wrap: wrap; gap: 5px; }

/* ---------------- responsive ---------------- */
@media (max-width: 1180px) {
  .pair-phones { grid-template-columns: repeat(2, minmax(0, 300px)); }
  .pair-side { grid-column: 1 / -1; }
  .studio { grid-template-columns: 220px minmax(0, 1fr) 300px; }
  .st-src .phone { max-width: 200px; }
}
@media (max-width: 980px) {
  .studio { grid-template-columns: minmax(0, 1fr) 280px; }
  .st-src { grid-column: 1; grid-row: 1; border-right: 0; border-bottom: 1px solid var(--line); grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .st-src .kicker, .st-src .phone, .st-src > .btn { grid-column: 1 / -1; }
  .st-src .phone { max-width: 180px; }
  .st-main { grid-column: 1; grid-row: 2; }
  .st-gallery { grid-column: 2; grid-row: 1 / span 2; }
  .lab-body { grid-template-columns: 210px minmax(0, 1fr); }

/* =====================================================================

   ===================================================================== */
const $  = (q, el = document) => el.querySelector(q);
const $$ = (q, el = document) => Array.from(el.querySelectorAll(q));
const clone = v => JSON.parse(JSON.stringify(v));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const round = (v, step = 1) => Math.round(v / step) * step;
const esc = t => String(t == null ? "" : t)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const uid = (p = "") => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtAgo = t => {
  if (!t) return "never";
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 45) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return new Date(t).toLocaleDateString();
};

/* Hyperscript: h("div.card#id", {onclick}, children...) */
function h(tag, props, ...kids) {
  const m = /^([a-z0-9]+)?((?:[.#][\w-]+)*)$/i.exec(tag) || [];
  const el = document.createElement(m[1] || "div");
  (m[2] || "").replace(/([.#])([\w-]+)/g, (_, k, v) => { k === "." ? el.classList.add(v) : (el.id = v); });
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "html") el.innerHTML = v;
    else if (k === "text") el.textContent = v;
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k === "dataset") Object.assign(el.dataset, v);
    else if (k in el && typeof v !== "string") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(9)) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}

/* Safe browser storage (per-viewer conveniences only) */
const LS = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

/* Minimal event bus so modules stay decoupled */
const Bus = {
  m: {},
  on(ev, fn) { (this.m[ev] = this.m[ev] || []).push(fn); },
  emit(ev, ...a) { (this.m[ev] || []).forEach(fn => { try { fn(...a); } catch (e) { console.error(ev, e); } }); },
};

function toast(msg, kind) {
  const t = $("#toast");
  if (!t) return;
  t.textContent = msg; t.className = "on" + (kind ? " " + kind : "");
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.className = ""), 2600);
}

/* In-page confirm (the viewer frame never shows window.confirm) */
function confirmBox(title, body, okLabel = "Confirm", danger = false) {
  return new Promise(res => {
    const close = v => { m.remove(); res(v); };
    const m = h("div.modal", { onclick: e => { if (e.target === m) close(false); } },
      h("div.modal-card", null,
        h("h3", { text: title }),
        body ? h("p", { html: body }) : null,
        h("div.modal-actions", null,
          h("button.btn", { text: "Cancel", onclick: () => close(false) }),
          h("button.btn" + (danger ? ".danger" : ".primary"), { text: okLabel, onclick: () => close(true) }))));
    document.body.append(m);
    m.querySelector(".primary,.danger").focus();
  });
}

/* In-page text prompt */
function promptBox(title, value = "", okLabel = "OK", multiline = false) {
  return new Promise(res => {
    const inp = multiline ? h("textarea#promptBoxInput", { rows: 5 }) : h("input#promptBoxInput", { type: "text" });
    inp.value = value;
    const close = v => { m.remove(); res(v); };
    const m = h("div.modal", { onclick: e => { if (e.target === m) close(null); } },
      h("div.modal-card", null, h("h3", { text: title }), inp,
        h("div.modal-actions", null,
          h("button.btn", { text: "Cancel", onclick: () => close(null) }),
          h("button.btn.primary", { text: okLabel, onclick: () => close(inp.value) }))));
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter" && (!multiline || e.metaKey || e.ctrlKey)) { e.preventDefault(); close(inp.value); }
      if (e.key === "Escape") close(null);
    });
    document.body.append(m); inp.focus(); inp.select && inp.select();
  });
}

/* Copy with graceful fallback */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast("Copied"); return true; }
  catch (e) { toast("Copy blocked here — select the text and copy it"); return false; }
}

/* ---- 10-model.js ---- */
/* =====================================================================
   10 · MODEL — boards, screens, blocks, and what we compute from them:
   the link graph, tap counts per journey, and feature coverage.
   Board  = { id, name, kind: today|proposal|variant, start, screens[] }
   Screen = { id, name, over?, tag?, pair?, purpose?, changes[], blocks[] }
   Block  = { id, t, x, y, w, h, text, role, v, link, fid, does, … }
   ===================================================================== */
function normBoard(b) {
  b.screens = (b.screens || []).filter(Boolean).map(normScreen);
  const ids = new Set();
  b.screens.forEach(s => { while (ids.has(s.id)) s.id = s.id + "-2"; ids.add(s.id); });
  if (!b.start || !b.screens.some(s => s.id === b.start)) b.start = b.screens[0] ? b.screens[0].id : null;
  return b;
}
function normScreen(s) {
  s.blocks = (s.blocks || []).filter(Boolean).map(normBlock);
  const seen = new Set();
  s.blocks.forEach((bl, i) => {
    if (!bl.id || seen.has(bl.id)) { let n = i + 1, id; do { id = s.id + "-" + n++; } while (seen.has(id)); bl.id = id; }
    seen.add(bl.id);
  });
  if (!Array.isArray(s.changes)) s.changes = [];
  if (!s.name) s.name = s.id;
  return s;
}
function normBlock(b) {
  if (!TYPES[b.t]) b.t = "panel";
  ["x", "y", "w", "h"].forEach(k => { b[k] = Number.isFinite(+b[k]) ? Math.round(+b[k] * 2) / 2 : 0; });
  b.w = Math.max(4, b.w); b.h = Math.max(4, b.h);
  if (!b.role || !ROLE[b.role]) b.role = "neutral";
  return b;
}
const screenById = (board, id) => board && board.screens.find(s => s.id === id);

/* ---------- link graph ---------- */
/* every navigation a screen offers: [{to, block, item}] — "back" stays out of the graph */
function edgesOf(board, screen) {
  const out = [];
  (screen.blocks || []).forEach(b => {
    if (b.hidden) return;
    if (b.t === "seg" && Array.isArray(b.links)) b.links.forEach((l, i) => { if (l && l !== "back" && l !== screen.id) out.push({ to: l, block: b, item: i }); });
    if (b.link && b.link !== "back" && b.link !== screen.id) out.push({ to: b.link, block: b });
  });
  return out;
}
function destinationsFrom(board, sid) {
  const s = screenById(board, sid);
  return s ? [...new Set(edgesOf(board, s).map(e => e.to).filter(t => screenById(board, t)))] : [];
}
/* shortest tap path to a feature — BFS over screens; the final tap on the target counts */
function journeyTaps(board, j) {
  const start = j.from === "home" ? board.start : (board.screens.find(s => s.tag === j.from) || {}).id;
  if (!start || !screenById(board, start)) return null;
  const dist = { [start]: 0 }, prev = {}, q = [start];
  while (q.length) {
    const sid = q.shift(), s = screenById(board, sid);
    const hit = (s.blocks || []).find(b => !b.hidden && b.t !== "note" && fidsOf(b).includes(j.fid));
    if (hit) {
      const path = [];
      for (let c = sid; prev[c]; c = prev[c].from) path.unshift(prev[c]);
      return { taps: dist[sid] + 1, path, screen: sid, hit };
    }
    for (const e of edgesOf(board, s)) if (dist[e.to] == null && screenById(board, e.to)) {
      dist[e.to] = dist[sid] + 1; prev[e.to] = { from: sid, to: e.to, block: e.block }; q.push(e.to);
    }
  }
  return null;
}
function reachable(board) {
  const seen = new Set([board.start]), q = [board.start];
  while (q.length) { const s = screenById(board, q.shift()); if (!s) continue; edgesOf(board, s).forEach(e => { if (!seen.has(e.to)) { seen.add(e.to); q.push(e.to); } }); }
  board.screens.forEach(s => { if (s.over && seen.has(s.over)) seen.add(s.id); });
  return seen;
}
function brokenLinks(board) {
  const out = [];
  board.screens.forEach(s => edgesOf(board, s).forEach(e => { if (!screenById(board, e.to)) out.push({ screen: s, block: e.block, to: e.to }); }));
  return out;
}

/* ---------- feature coverage (rule #1: nothing of Today may disappear) ---------- */
function featureIndex(board) {
  const m = new Map();
  (board ? board.screens : []).forEach(s => s.blocks.forEach(b => {
    if (b.hidden) return;
    fidsOf(b).forEach(f => { if (!m.has(f)) m.set(f, []); m.get(f).push({ s, b }); });
  }));
  return m;
}
function coverage(today, prop) {
  const need = featureIndex(today), have = featureIndex(prop);
  const missing = [...need.keys()].filter(f => !have.has(f));
  const added = [...have.keys()].filter(f => !need.has(f));
  return { need, have, missing, added, total: need.size, kept: need.size - missing.length };
}
/* the endings of one screen read as one place: “Post-match (8 endings)” */
function placeName(board, s) {
  const root = s.stateOf ? screenById(board, s.stateOf) : s;
  const n = root ? board.screens.filter(x => x.stateOf === root.id).length : 0;
  return n ? root.name.split(" · ")[0] + " (" + (n + 1) + " endings)" : s.name;
}
/* for one Today screen: where did each of its features go in the proposal? */
function whereDidItGo(todayScreen, prop) {
  const have = featureIndex(prop), rows = [], done = new Set();
  todayScreen.blocks.forEach(b => fidsOf(b).forEach(f => {
    if (done.has(f)) return; done.add(f);
    const places = (have.get(f) || []).map(x => placeName(prop, x.s));
    rows.push({ fid: f, name: (FEATURES[f] || {}).name || f, places: [...new Set(places)] });
  }));
  return rows;
}
function featureName(f) { return (FEATURES[f] || CUSTOM_FEATURES[f] || {}).name || f; }
const CUSTOM_FEATURES = {};   /* features added by people in the inspector (kept in the cloud) */

/* Start Battle alone in its row? (P1) — other tappable things sharing its band */
function rowMates(board) {
  const home = screenById(board, board.start); if (!home) return null;
  const sb = home.blocks.find(b => fidsOf(b).includes("start-battle")); if (!sb) return null;
  return home.blocks.filter(b => b !== sb && !b.hidden && b.t !== "note" && (b.link || fidsOf(b).length) && b.t !== "panel"
    && b.y + b.h / 2 > sb.y && b.y + b.h / 2 < sb.y + sb.h).length;
}
/* progression ladders shown on the start screen (M3) */
const LADDER_FIDS = ["account-trophies", "faction-trophies", "faction-rank", "faction-level", "pass"];
function laddersOnHome(board) {
  const home = screenById(board, board.start); if (!home) return null;
  const f = new Set(); home.blocks.forEach(b => { if (!b.hidden) fidsOf(b).forEach(x => { if (LADDER_FIDS.includes(x)) f.add(x); }); });
  return f.size;
}

/* a block may carry several features: "a,b" or ["a","b"] */
function fidsOf(b) {
  if (!b || !b.fid) return [];
  return (Array.isArray(b.fid) ? b.fid : String(b.fid).split(",")).map(s => s.trim()).filter(Boolean);
}
function doesOf(b) {
  if (b.does) return b.does;
  const f = fidsOf(b).map(k => FEATURES[k]).filter(Boolean);
  return f.length ? f[0].does : "";
}
function labelOf(b) {
  const f = fidsOf(b).map(k => FEATURES[k]).filter(Boolean)[0];
  const txt = [b.text, b.icon].filter(Boolean).join(" ").trim();
  return b.name || (f ? f.name : "") || txt || (TYPES[b.t] ? TYPES[b.t].label : b.t);
}

/* ---- 23-data-postmatch.js ---- */
/* =====================================================================
   23 · POST-MATCH — every way a match can end, on one skeleton.
   With ~4-minute matches the result is the most-seen metagame screen,
   so the proposal draws each ending: victory, a win by surrender,
   defeat, surrender, a losing streak, a lost connection, a draw and an
   event run. Same beats everywhere — 1 result · 2 progress · 3 loot or
   why · 4 one action — and Play again never moves.
   Also here: what the benchmarks do after a match, the offer guardrails
   and the tip rules. Compare (section “Post-match”) reads all of it.
   ===================================================================== */

/* Mechanics the proposal adds. They are not in the build, so they never
   count toward coverage; the app marks them NEW wherever they appear. */
const PROPOSED_FEATURES = {
  "play-again":      { cat: "Battle", name: "Play again", does: "New: queues the next match of the same mode straight from the result — Brawl Stars' Play again." },
  "win-streak":      { cat: "Battle", name: "Win streak bonus", does: "New: bonus trophies from the 2nd win in a row (Brawl Stars pays up to +5 a game; Hearthstone doubles stars from the 3rd win)." },
  "loss-protection": { cat: "Battle", name: "Trophy protection", does: "New: softens a losing streak — a shield, a floor at Trophy Road tiers or Underdog. Which one is an open decision." },

/* ---------- text measurement (canvas) ---------- */
const _mctx = document.createElement("canvas").getContext("2d");
const _mcache = new Map();
function textW(s, size, weight, family, ls = 0) {
  const k = s + "|" + size + "|" + weight + "|" + family + "|" + ls;
  let w = _mcache.get(k);
  if (w == null) {
    _mctx.font = `${weight} ${size}px ${family}`;
    w = _mctx.measureText(s).width + ls * Math.max(0, [...s].length - 1);
    if (_mcache.size > 6000) _mcache.clear();
    _mcache.set(k, w);
  }
  return w;
}
function ellip(s, maxW, size, weight, family, ls) {
  if (textW(s, size, weight, family, ls) <= maxW) return s;
  let a = [...s];
  while (a.length > 1 && textW(a.join("") + "…", size, weight, family, ls) > maxW) a.pop();
  return a.join("") + "…";
}
function wrapLines(text, maxW, size, weight, family, ls) {
  const out = [];
  for (const para of String(text).split("\n")) {
    const words = para.split(/\s+/).filter(Boolean);
    if (!words.length) { out.push(""); continue; }
    let line = "";
    for (const w of words) {
      const t = line ? line + " " + w : w;
      if (!line || textW(t, size, weight, family, ls) <= maxW) line = t;
      else { out.push(line); line = w; }
    }
    out.push(line);
  }
  return out;
}
/* Fit text in a box: shrink from `size` to `min`, then clamp lines with an ellipsis */
function fitText(text, maxW, maxH, o) {
  const fam = o.family, wt = o.weight || 600, ls = o.ls || 0, lh = o.lh || 1.08;
  let size = o.size, lines;
  const maxL = o.lines || 99;
  for (; size >= (o.min || size); size -= 0.5) {
    lines = wrapLines(text, maxW, size, wt, fam, ls);
    if (lines.length <= Math.max(1, Math.floor(maxH / (size * lh))) && lines.length <= maxL &&
        lines.every(l => textW(l, size, wt, fam, ls) <= maxW)) return { size, lines, lh };
    if (!o.min || o.min === o.size) break;
  }
  size = Math.max(o.min || o.size, size);
  lines = wrapLines(text, maxW, size, wt, fam, ls);
  const fitL = Math.max(1, Math.min(maxL, Math.floor(maxH / (size * lh))));
  if (lines.length > fitL) { lines = lines.slice(0, fitL); lines[fitL - 1] = lines[fitL - 1] + "…"; }
  lines = lines.map(l => ellip(l, maxW, size, wt, fam, ls));
  return { size, lines, lh };
}
/* currency glyphs keep their own colour wherever they appear */
const GLYPH_FILL = { "⬤": "#F2B94A", "★": "#FFD35C", "◆": "#B98CFF", "▣": "#7FC8F0" };
function glyphSpans(line) {
  return String(line).split(/([⬤★◆▣])/).map(p => GLYPH_FILL[p] ? `<tspan fill="${GLYPH_FILL[p]}">${p}</tspan>` : esc(p)).join("");
}
/* SVG <text> block. anchor: start|middle|end ; vy = vertical centre */
function svgText(text, x, vy, maxW, maxH, o) {
  if (text == null || text === "") return "";
  const up = o.up ? String(text).toUpperCase() : String(text);
  const f = fitText(up, maxW, maxH, o);
  const lh = f.size * f.lh;
  const y0 = vy - (f.lines.length - 1) * lh / 2;
  const anchor = o.anchor || "middle";
  const ls = o.ls ? ` letter-spacing="${o.ls}"` : "";
  return `<text x="${x.toFixed(1)}" y="${y0.toFixed(1)}" font-family="${o.family.replace(/"/g, "'")}" font-size="${f.size}" ` +
    `font-weight="${o.weight || 600}" fill="${o.fill}" text-anchor="${anchor}" dominant-baseline="central"${ls}` +
    `${o.opacity != null ? ` fill-opacity="${o.opacity}"` : ""}>` +
    f.lines.map((l, i) => `<tspan x="${x.toFixed(1)}" dy="${i ? lh.toFixed(1) : 0}">${glyphSpans(l)}</tspan>`).join("") + `</text>`;
}

/* ---------- glyphs (pictograms: "restroom sign" people, buildings, art) ---------- */
function personFull(cx, top, H, col, op = 1) {
  const hr = H * 0.105, bw = H * 0.30, bt = top + hr * 2 + H * 0.025, bh = H * 0.37, lw = H * 0.115, lt = bt + bh - H * 0.03;
  return `<g fill="${col}" fill-opacity="${op}">` +
    `<circle cx="${cx}" cy="${top + hr}" r="${hr}"/>` +
    `<rect x="${cx - bw / 2}" y="${bt}" width="${bw}" height="${bh}" rx="${bw * 0.32}"/>` +
    `<rect x="${cx - bw / 2 + H * 0.02}" y="${lt}" width="${lw}" height="${top + H - lt}" rx="${lw * 0.4}"/>` +
    `<rect x="${cx + bw / 2 - H * 0.02 - lw}" y="${lt}" width="${lw}" height="${top + H - lt}" rx="${lw * 0.4}"/></g>`;
}
function personBust(cx, top, H, col, op = 1) {
  const hr = H * 0.23, sw = H * 0.92;
  const sy = top + hr * 2 + H * 0.04;
  return `<g fill="${col}" fill-opacity="${op}"><circle cx="${cx}" cy="${top + hr}" r="${hr}"/>` +
    `<path d="M${cx - sw / 2},${top + H} L${cx - sw / 2},${sy + H * 0.16} Q${cx - sw / 2},${sy} ${cx - sw / 2 + H * 0.2},${sy} ` +
    `L${cx + sw / 2 - H * 0.2},${sy} Q${cx + sw / 2},${sy} ${cx + sw / 2},${sy + H * 0.16} L${cx + sw / 2},${top + H} Z"/></g>`;
}
function building(cx, top, H, col, op = 1) {
  const w = H * 0.78, bx = cx - w / 2, by = top + H * 0.3;
  return `<g fill="${col}" fill-opacity="${op}">` +
    `<path d="M${bx - H * 0.04},${by} L${cx},${top} L${bx + w + H * 0.04},${by} Z"/>` +
    `<rect x="${bx}" y="${by}" width="${w}" height="${top + H - by}" rx="${H * 0.03}"/></g>` +
    `<rect x="${cx - H * 0.1}" y="${top + H * 0.62}" width="${H * 0.2}" height="${H * 0.38}" fill="#0B1519" fill-opacity=".55"/>`;
}
function mountains(w, h, col) {
  const y = h * 0.78;
  return `<g fill="${col}" fill-opacity=".22"><circle cx="${w * 0.74}" cy="${h * 0.32}" r="${Math.min(w, h) * 0.1}"/>` +
    `<path d="M${w * 0.06},${y} L${w * 0.32},${h * 0.36} L${w * 0.5},${h * 0.6} L${w * 0.62},${h * 0.46} L${w * 0.94},${y} Z"/></g>`;
}
function hexPath(cx, cy, r) {
  let d = "";
  for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i - Math.PI / 2; d += (i ? "L" : "M") + (cx + r * Math.cos(a)).toFixed(2) + "," + (cy + r * Math.sin(a)).toFixed(2); }
  return d + "Z";
}
function checkMark(cx, cy, s, col) {
  return `<path d="M${cx - s * 0.5},${cy} L${cx - s * 0.12},${cy + s * 0.38} L${cx + s * 0.55},${cy - s * 0.4}" fill="none" stroke="${col}" stroke-width="${Math.max(1.6, s * 0.2)}" stroke-linecap="round" stroke-linejoin="round"/>`;

      s += svgText(cells[2] || "", w - 10, cy, 64, rh, T(b, env, { size: fs, min: 6, fill: ROLE.value.lt, weight: 700, anchor: "end", lines: 1 }));
    } else {
      s += `<circle cx="16" cy="${cy}" r="${Math.min(rh * 0.28, 7)}" fill="${R0.c}" fill-opacity=".45"/>` +
        `<rect x="30" y="${cy - 2.5}" width="${(w - 80) * (0.55 + 0.35 * ((i * 37) % 10) / 10)}" height="5" rx="2.5" fill="#FFFFFF" fill-opacity=".22"/>` +
        `<rect x="${w - 40}" y="${cy - 2.5}" width="28" height="5" rx="2.5" fill="${ROLE.value.c}" fill-opacity=".45"/>`;
    }
  }
  return s;
};

R.stats = (b, env) => {
  const f = frameAttrs(b, "soft"), w = b.w, h = b.h, R0 = roleOf(b);
  let s = frameRect(w, h, f);
  const items = b.items || [];
  const n = Math.max(1, items.length);
  const rh = (h - 8) / n;
  items.forEach((it, i) => {
    const cy = 4 + i * rh + rh / 2, fs = clamp(rh * 0.4, 7, 14);
    if (i) s += `<rect x="10" y="${4 + i * rh}" width="${w - 20}" height=".8" fill="#FFFFFF" fill-opacity=".12"/>`;
    s += svgText(it.k || "", 12, cy, w * 0.5, rh, T(b, env, { size: fs, min: 6.5, fill: R0.lt, up: true, weight: 700, ls: 0.3, anchor: "start", lines: 1 }));
    const dW = it.d ? textW(String(it.d), fs * 0.9, 700, env.font) + 12 : 0;
    s += svgText(String(it.v != null ? it.v : ""), w - 12 - dW, cy, w * 0.35, rh, T(b, env, { size: fs * 1.05, min: 6.5, fill: "#FFFFFF", weight: 700, anchor: "end", lines: 1 }));
    if (it.d) s += svgText(String(it.d), w - 10, cy, dW, rh, T(b, env, { size: fs * 0.9, min: 6, fill: ROLE.gain.lt, weight: 700, anchor: "end", lines: 1 }));
  });
  return s;
};

R.hex = (b, env) => {
  const w = b.w, h = b.h, R0 = roleOf(b), r = Math.min(w, h) / 2 - 1;
  return `<path d="${hexPath(w / 2, h / 2, r)}" fill="${R0.c}" fill-opacity=".92" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="1"/>` +
    svgText(b.text || "", w / 2, h / 2 + 0.5, r * 1.5, r * 1.4, T(b, env, { size: r * 0.9, min: 6, fill: R0.ink, weight: 700, lines: 1 }));
};

R.stamp = (b, env) => {
  const w = b.w, h = b.h, R0 = roleOf(b), r = Math.min(w, h) / 2 - 2;
  return `<circle cx="${w / 2}" cy="${h / 2}" r="${r}" fill="${R0.c}" fill-opacity=".16" stroke="${R0.c}" stroke-width="3"/>` +
    `<circle cx="${w / 2}" cy="${h / 2}" r="${r * 0.82}" fill="none" stroke="${R0.c}" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="4 3"/>` +
    svgText(b.text || "", w / 2, h / 2 - (b.sub ? r * 0.12 : 0), r * 1.6, r * 0.8, T(b, env, { size: r * 0.42, min: 8, fill: R0.lt, up: true, weight: 700, ls: 1, lines: 1 })) +
    (b.sub ? svgText(b.sub, w / 2, h / 2 + r * 0.34, r * 1.5, r * 0.4, T(b, env, { size: r * 0.16, min: 6.5, fill: "#FFFFFF", weight: 600, opacity: 0.85, lines: 2 })) : "");
};

R.seg = (b, env) => {
  const w = b.w, h = b.h, R0 = roleOf(b);
  const items = b.items || ["One", "Two"];
  const n = items.length, act = b.active || 0;
  let s = `<rect x=".6" y=".6" width="${w - 1.2}" height="${h - 1.2}" rx="${h / 2.4}" fill="#050B0D" fill-opacity=".7" stroke="${R0.c}" stroke-opacity=".45"/>`;
  const sw = (w - 4) / n;
  items.forEach((it, i) => {
    const x = 2 + i * sw, on = i === act;
    if (on) s += `<rect x="${x}" y="2" width="${sw}" height="${h - 4}" rx="${(h - 4) / 2.4}" fill="${R0.c}"/>`;
    s += svgText(it, x + sw / 2, h / 2, sw - 6, h - 4, T(b, env, { size: clamp(h * 0.4, 7, 13), min: 6, fill: on ? R0.ink : "#C9D6D7", up: true, weight: 700, ls: 0.3, lines: 1 }));
  });
  return s;
};
/* sub-rects of a segmented control, used by Play mode hit-testing */
function segRects(b) {
  const n = (b.items || []).length || 1, sw = (b.w - 4) / n;
  return (b.items || []).map((_, i) => ({ x: b.x + 2 + i * sw, y: b.y, w: sw, h: b.h, i }));
}

R.note = (b, env) => {
  if (env.play || env.export) return "";
  const w = b.w, h = b.h;
  return `<rect x="1" y="2" width="${w - 2}" height="${h - 2}" rx="3" fill="#000" fill-opacity=".25"/>` +
    `<rect x="0" y="0" width="${w - 2}" height="${h - 2}" rx="3" fill="#F3E08A"/>` +
    svgText(b.text || "Note", 7, (h - 2) / 2, w - 14, h - 10, T(b, env, { size: b.fs || 10, min: 6.5, fill: "#3A300A", weight: 600, anchor: "start", lh: 1.15 }));
};

R.badge = (b, env) => {
  const w = b.w, h = b.h, R0 = b.role ? roleOf(b) : ROLE.alert, r = Math.min(w, h) / 2;
  return `<circle cx="${w / 2}" cy="${h / 2}" r="${r - 0.5}" fill="${R0.c}" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="1"/>` +
    (b.text ? svgText(b.text, w / 2, h / 2 + 0.4, r * 1.7, r * 1.6, T(b, env, { size: r * 1.05, min: 5.5, fill: "#FFFFFF", weight: 700, lines: 1 })) : "");
};

R.rule = (b) => `<rect x="0" y="${b.h / 2 - 0.5}" width="${b.w}" height="1" fill="${roleOf(b).c}" fill-opacity=".5"/>`;

R.image = (b, env) => {
  const src = b.src && (IMAGES[b.src] || b.src);
  const w = b.w, h = b.h;
  if (!src) return frameRect(w, h, frameAttrs(b, "soft")) + svgText("Image", w / 2, h / 2, w - 8, h, T(b, env, { size: 10, fill: "#C9D6D7" }));
  return `<image href="${esc(src)}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="xMidYMid slice" opacity="${b.opacity != null ? b.opacity : 1}"/>`;
};

/* generic decorations that any block can carry: badge (top-right), glow, dim */
function decorate(b, inner, env) {
  let s = inner;
  if (b.glow) s = `<rect x="-3" y="-3" width="${b.w + 6}" height="${b.h + 6}" rx="${(b.r != null ? b.r : 8) + 3}" fill="none" stroke="${roleOf(b).c}" stroke-opacity=".45" stroke-width="3"/>` + s;
  if (b.badge != null && b.badge !== "") {
    const r = 7.5, cx = b.w - 2, cy = 2;
    s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${ROLE.alert.c}" stroke="#fff" stroke-opacity=".85" stroke-width="1"/>` +
      (b.badge === "•" ? "" : svgText(String(b.badge), cx, cy + 0.4, r * 1.8, r * 1.8, { family: env.font, size: 8.5, min: 6, fill: "#fff", weight: 700, lines: 1 }));
  }
  if (b.dim && b.t !== "card") s = `<g opacity=".45">${s}</g>`;
  return s;
}

/* one block → SVG group at its position */
function blockSVG(b, env) {
  if (b.hidden && !env.showHidden) return "";
  const fn = R[b.t] || R.panel;
  let inner = "";
  try { inner = fn(b, env); } catch (e) { console.warn("render", b.t, e); inner = frameRect(b.w, b.h, frameAttrs(b, "soft")); }
  const named = env.named ? ` id="${esc(env.named(b))}"` : "";
  return `<g${named} transform="translate(${(+b.x).toFixed(1)},${(+b.y).toFixed(1)})" data-id="${esc(b.id)}">${decorate(b, inner, env)}</g>`;
}

/* numbering for the "what each button does" layer: reading order, only blocks that do something */
function annotatedBlocks(screen) {
  return (screen.blocks || [])
    .filter(b => !b.hidden && b.t !== "note" && (b.does || b.link || (b.fid && FEATURES[b.fid])))
    .sort((a, b) => (Math.round(a.y / 18) - Math.round(b.y / 18)) || (a.x - b.x));
}

/* A full screen. opts: {board, annot, export, play, bgless, showHidden, named} */
function screenSVG(screen, opts = {}) {
  const env = {
    font: opts.export ? FONT_EXPORT : FONT_UI,
    export: !!opts.export, play: !!opts.play, showHidden: !!opts.showHidden,
    k: "s" + (++screenSVG.seq) + "_",      /* unique id prefix: many SVGs share one document */
  };
  if (opts.named) {                         /* Figma: each block's group is named after what it is */
    const seen = {};
    env.named = b => {
      const n = String(labelOf(b) || b.t).replace(/\s+/g, " ").trim().slice(0, 60), k = n.toLowerCase();
      seen[k] = (seen[k] || 0) + 1;
      return seen[k] > 1 ? n + " " + seen[k] : n;
    };
  }
  const blocks = (screen.blocks || []).slice().sort((a, b) => (a.z || 0) - (b.z || 0));
  let body = "";
  /* popup: its parent screen is drawn first, dimmed */
  if (screen.over && opts.board) {
    const parent = opts.board.screens.find(s => s.id === screen.over && s.id !== screen.id);
    if (parent && !parent.over) {
      const penv = Object.assign({}, env, { play: true });
      body += (parent.blocks || []).slice().sort((a, b) => (a.z || 0) - (b.z || 0)).map(b => blockSVG(b, penv)).join("");
      body += `<rect width="${PW}" height="${PH}" fill="#020607" fill-opacity=".72"/>`;
    }
  }
  if (screen.underlay && !env.export && !env.play && opts.trace !== false) {
    const src = IMAGES[screen.underlay] || screen.underlay;
    if (src) body += `<image href="${esc(src)}" x="0" y="0" width="${PW}" height="${PH}" preserveAspectRatio="xMidYMid slice" opacity="${screen.underlayOpacity != null ? screen.underlayOpacity : 0.35}"/>`;
  }
  body += blocks.map(b => blockSVG(b, env)).join("");
  if (opts.annot) {
    annotatedBlocks(screen).forEach((b, i) => {
      const cx = clamp(b.x + 2, 9, PW - 9), cy = clamp(b.y + 2, 9, PH - 9);
      body += `<g class="anno"><circle cx="${cx}" cy="${cy}" r="8.5" fill="#FFB547" stroke="#1B1203" stroke-width="1.4"/>` +
        `<text x="${cx}" y="${cy + 0.5}" font-size="9.5" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#1B1203" font-family="${env.font.replace(/"/g, "'")}">${i + 1}</text></g>`;
      /* not in the build: a small NEW flag beside the number */
      if (isNewBlock(b)) {
        const fx = cx > PW - 44 ? cx - 36 : cx + 10;
        body += `<g class="anno"><rect x="${fx}" y="${cy - 6}" width="26" height="12" rx="3" fill="#5CC6DF" stroke="#06232B" stroke-width="1"/>` +
          `<text x="${fx + 13}" y="${cy + 0.5}" font-size="7.5" font-weight="700" letter-spacing=".4" text-anchor="middle" dominant-baseline="central" fill="#06232B" font-family="${env.font.replace(/"/g, "'")}">NEW</text></g>`;
      }
    });
  }
  const bg = screen.bg || "#0B1519";
  const defs = `<defs><radialGradient id="${env.k}bg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#1B3440" stop-opacity=".9"/><stop offset="1" stop-color="${bg}" stop-opacity="0"/></radialGradient></defs>`;
  const ground = opts.bgless ? "" : `<rect width="${PW}" height="${PH}" fill="${bg}"/><rect width="${PW}" height="${PH}" fill="url(#${env.k}bg)"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${PW} ${PH}" width="${opts.width || PW}" height="${opts.height || PH}"${opts.cls ? ` class="${opts.cls}"` : ""} role="img" aria-label="${esc(screen.name)}">${defs}${ground}${body}</svg>`;
}

screenSVG.seq = 0;

/* ---------- Figma: an SVG that Figma turns into named, editable layers ----------
   Paste it on the canvas (⌘V) or drop the file: each screen arrives as a group
   named after the screen, each block as a layer named after what it is. Figma
   ignores dominant-baseline, so text moves to an explicit baseline, and it gets
   the one family Figma has built in (Barlow Condensed, from Google Fonts). */
function forFigma(svg) {
  return svg
    .replace(/<text\b([^>]*)>/g, (m, a) => {
      if (!/dominant-baseline="central"/.test(a)) return m;
      const fs = +((a.match(/font-size="([\d.]+)"/) || [])[1] || 12);
      return "<text" + a.replace(/ dominant-baseline="central"/, "").replace(/ y="(-?[\d.]+)"/, (mm, y) => ` y="${(+y + fs * 0.33).toFixed(1)}"`) + ">";
    })
    .replace(/font-family="[^"]*"/g, 'font-family="Barlow Condensed"')
    .replace(/ role="img" aria-label="[^"]*"/, "");
}
function figmaSVG(board, screens) {
  if (screens.length === 1) return forFigma(screenSVG(screens[0], { board, export: true, named: true }));
  const cols = Math.min(screens.length, 6), gx = 80, gy = 120;
  let body = "";
  screens.forEach((s, i) => {
    const x = (i % cols) * (PW + gx), y = Math.floor(i / cols) * (PH + gy);
    const inner = screenSVG(s, { board, export: true, named: true }).replace(/^<svg[^>]*>/, "").replace(/<\/svg>\s*$/, "");
    body += `<g id="${esc(s.name)}" transform="translate(${x},${y})"><clipPath id="fg${i}"><rect width="${PW}" height="${PH}"/></clipPath><g clip-path="url(#fg${i})">${inner}</g></g>`;
  });
  const W = cols * (PW + gx) - gx, H = Math.ceil(screens.length / cols) * (PH + gy) - gy;
  return forFigma(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${body}</svg>`);
}

/* SVG string → PNG/JPEG Blob (for downloads and for the images sent to AI) */
function svgToBlob(svgStr, scale = 2, type = "image/png", quality = 0.9) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(new Blob([svgStr], { type: "image/svg+xml" }));
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = Math.round(PW * scale); c.height = Math.round(PH * scale);
      const g = c.getContext("2d");
      g.fillStyle = "#0B1519"; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("canvas export failed")), type, quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("svg decode failed")); };
    img.src = url;
  });
}

/* Block factory: type + geometry + props → a clean block */
function makeBlock(t, x, y, w, h, props = {}) {
  const T0 = TYPES[t] || TYPES.panel;
  return Object.assign({ id: uid("b"), t, x: round(x), y: round(y), w: round(w || T0.w), h: round(h || T0.h) }, clone(T0.p), props);
