<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#142428">
<title>AoW UX Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{--ground:#0d181b;--panel:#142428;--line:#264047;--line2:#33525b;--ink:#e9f0ec;--muted:#8fa8a5;--sel:#e88a2d;}
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body{height:100dvh;background:var(--ground);color:var(--ink);display:flex;flex-direction:column;
       font-family:"Barlow Condensed","Arial Narrow",sans-serif;}
  header{display:flex;align-items:flex-end;gap:6px;padding:8px 10px 0;background:var(--panel);
         border-bottom:1px solid var(--line);flex:none;
         padding-top:calc(8px + env(safe-area-inset-top));}
  .brand{text-transform:uppercase;font-weight:700;font-size:15px;letter-spacing:.05em;margin-right:10px;padding-bottom:8px;line-height:1;}
  .brand small{display:block;font-family:"IBM Plex Mono",monospace;font-size:8px;color:#5d7a78;letter-spacing:.12em;margin-top:1px;}
  .tab{text-transform:uppercase;font-size:13.5px;letter-spacing:.05em;padding:8px 13px;cursor:pointer;
       border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;color:var(--muted);
       background:transparent;font-family:inherit;white-space:nowrap;}
  .tab.on{background:var(--ground);color:var(--sel);border-color:var(--line2);position:relative;top:1px;}
  main{flex:1;min-height:0;position:relative;}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--ground);}
  iframe[hidden]{display:none;}
  @media (max-width:430px){.brand{font-size:13px;margin-right:4px;} .tab{font-size:12px;padding:7px 10px;}}
</style>
</head>
<body>
<header>
  <div class="brand">AoW UX Studio<small>ASHES OF WAR</small></div>
  <button class="tab on" data-t="play">🎛️ Playable</button>
  <button class="tab" data-t="prop">📐 Pillars &amp; Proposal</button>
  <button class="tab" data-t="lab">🧪 Lab</button>
</header>
<main>
  <iframe id="f-play" src="play.html" title="Playable"></iframe>
  <iframe id="f-prop" src="proposal.html" title="Pillars & Proposal" hidden></iframe>
  <iframe id="f-lab" src="lab.html" title="Metagame Lab" hidden></iframe>
</main>
<script>
const tabs=document.querySelectorAll(".tab");
function sel(t,save){
  tabs.forEach(x=>x.classList.toggle("on",x.dataset.t===t));
  document.getElementById("f-play").hidden=t!=="play";
  document.getElementById("f-prop").hidden=t!=="prop";
  document.getElementById("f-lab").hidden=t!=="lab";
  if(save!==false)try{localStorage.setItem("studio-tab",t);}catch(e){}
}
tabs.forEach(b=>b.onclick=()=>sel(b.dataset.t));
function fromHash(){
  if(/#(proposal|prop|pillars)/.test(location.hash))return "prop";
  if(location.hash==="#play")return "play";
  if(location.hash==="#lab")return "lab";
  return null;
}
let t0=fromHash();
if(!t0){try{t0=localStorage.getItem("studio-tab");}catch(e){}}
sel(t0==="prop"||t0==="lab"?t0:"play",false);
window.addEventListener("hashchange",()=>{const t=fromHash();if(t)sel(t);});
</script>
</body>
</html>
